<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>City 13k</title>
<style>
* {
  margin:0;
  padding:0;
  user-select:none
}
html,
body {
  height:100dvh;
  overflow:hidden;
  background:#000;
  font-family:'Courier New',monospace;
  font-size:12px
}
#gl {
  display:block;
  width:100%;
  height:100%;
  touch-action:none
}
#hud,
#look {
  position:absolute;
  inset:0;
  pointer-events:none
}
#look {
  pointer-events:auto;
  z-index:1
}
.pad,
.nub {
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25)
}
.pad {
  bottom:24px;
  width:120px;
  height:120px;
  background:rgba(255,255,255,.08);
  pointer-events:auto;
  z-index:3
}
#joy {
  left:24px
}
.hold {
  right:24px;
  width:90px;
  height:90px;
  bottom:39px;
  display:flex;
  align-items:center;
  justify-content:center
}
#flyUp {
  bottom:139px
}
#flyUp,
#flyDown {
  display:none
}
.nub {
  left:35px;
  top:35px;
  width:50px;
  height:50px;
  background:rgba(255,255,255,.25)
}
#info {
  position:absolute;
  top:8px;
  left:8px;
  color:#fff;
  line-height:1.5;
  white-space:pre;
  z-index:4
}
.btn {
  pointer-events:auto;
  background:rgba(0,0,0,.5);
  color:#fff;
  padding:6px 10px;
  text-align:center
}
#gear {
  position:absolute;
  top:8px;
  right:8px;
  z-index:5;
  border-radius:4px;
  font-size:16px;
  line-height:1
}
#btns {
  position:absolute;
  top:44px;
  right:8px;
  display:none;
  flex-direction:column;
  gap:6px;
  z-index:4;
  background:rgba(0,0,0,.55);
  padding:8px;
  border-radius:6px
}
#btns.open,
.row {
  display:flex;
  gap:6px
}
.row .btn {
  flex:1 1 0;
  min-width:0
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="info"></div>
  <button class="btn" id="gear">=</button>
  <div id="btns">
    <button class="btn" id="flyBtn">FLY: 0</button>
    <button class="btn" id="resetBtn">RESET</button>
    <span class="row">
      <button class="btn" id="scaleDown">-</button>
      <button class="btn">S</button>
      <button class="btn" id="scaleUp">+</button>
    </span>
    <span class="row">
      <button class="btn" id="popDown"></button>
      <button class="btn">C</button>
      <button class="btn" id="popUp"></button>
    </span>
  </div>
  <div class="pad" id="joy"><div class="nub"></div></div>
  <div class="pad hold" id="jump">JUMP</div>
  <div class="pad hold" id="flyUp">UP</div>
  <div class="pad hold" id="flyDown">DOWN</div>
  <div id="look"></div>
</div>
<script type="module">
// ===== CONFIG: every tunable lives here; the shaders read these through ${} =====
const START_SEED = 7;            // city seed at load; RESET picks a new one
const START_BLOCKS = 10;         // city blocks per side at load
const BLOCKS_MIN = 2, BLOCKS_MAX = 30, BLOCKS_STEP = 2; // S row range and step
const LPB = 2;                   // lots per block side
const LOT = 18;                  // lot width, m
const SW = 4;                    // sidewalk width, m (also the crosswalk band)
const ROAD = 10;                 // road width curb to curb, m
const SETBACK = 1;               // building inset from its lot edge, m
const H_MIN = 8, H_MAX = 90;     // building height range, m
const H_SKEW = 3;                // higher means fewer tall towers
const H_EDGE = .7;               // share of height lost from city centre to edge
const START_PEOPLE = 13000;        // people at load
const MAX_PEOPLE = 30000, PEOPLE_STEP = 50; // C row cap and step
const NPC_SPEED = 1.4;           // mean walking speed, m/s
const NPC_SPEED_VAR = .25;       // each person's speed varies by up to this share
const NPC_TURN = 6;              // rad/s a person's body turns toward where it walks (drawn only)
const ARRIVE = .3;               // a person within this of its waypoint snaps onto it, m
const BRAIN_IN = 6;              // brain inputs: wall feelers left, ahead, right; player left, right; bias
const BRAIN_N = 8;               // LIF neurons per person: first half steer left, second half steer right
const FEEL = 2, FEEL_ANGLE = .6; // wall feeler reach m, side feeler angle rad
const PLAYER_SENSE = 6, PLAYER_BUMP = .8; // the player is felt within, and bumped within, this many m
const LIF_TAU = .1, LIF_NOISE = 3; // membrane time constant s, random input current per tick (exploration)
const W_INIT = .5, W_MAX = 3;    // starting weight spread, weight bound
const ELIG_TAU = 1;              // s an input-and-spike pairing stays eligible for dopamine
const LEARN = 2;                 // weight change per unit dopamine x eligibility per second
const DA_TONIC = .1, DA_TAU = 2; // resting dopamine, s to recover from a dip (a bump sets it to -1)
const STEER_KICK = .05, STEER_TAU = .5, STEER_MAX = 1.2; // rad each motor spike adds, s it fades, rad cap (under pi/2 so waypoints still close)
const INSIDE_MIN = 4, INSIDE_MAX = 30; // seconds spent inside a building
const START_S = 6;               // new people leave their first building within this many seconds
const STRIDE = 4.5;              // leg swing radians per metre walked
const SWING = .5;                // leg and arm swing amplitude, rad
const HIP = .9, SHOULDER = 1.45; // swing pivots, m (match BODY)
const HEAD_Y = 1.51;             // local height above which a person is skin coloured (match BODY)
const WALK_SPEED = 4, FLY_SPEED = 20, FLY_LIFT = 12; // player m/s: walking, flying across, flying up or down
const JUMP_VELOCITY = 5, GRAVITY = 15, JUMPS = 2;    // m/s, m/s^2, jumps before landing again
const STEP_GRIP = .3;            // snap to the floor within this far above it, m
const EYE = 1.7, RADIUS = .3;    // player eye height and body radius, m
const LOOK_SENSITIVITY = .005, PITCH_LIMIT = 1.4; // rad per pixel, rad
const JOY_RADIUS = 55, NUB_TRAVEL = 35; // px of thumb travel for full speed, px the nub moves
const FOV = 1.05, NEAR = .1, FAR = 600; // camera
const FOG = .008;                // fog density per m
const SKY = [.62, .7, .8];       // sky and fog colour
const SUN = [.5, .8, .3];        // light direction
const WIN_W = 2.5, FLOOR_H = 3.5;// window column width and storey height, m
const LIT = .85;                 // windows above this hash are lit
const STRIPE = .8;               // crosswalk stripe period, m
const EPS = .01;                 // position match tolerance, m
const INFO_FRAMES = 60;          // frames between info panel refreshes

// ===== DERIVED LAYOUT =====
const B = LPB * LOT + 2 * SW;    // block side including its sidewalk
const PITCH = B + ROAD;          // block to block spacing
const RING = SW / 2;             // people walk a ring this far inside the block edge
const RING_S = B - SW;           // ring side length
const INST = 8;                  // floats per instance: I = xyzw, J = xyzw (see shader)
const F = x => x.toFixed(3);     // JS number to GLSL float literal
const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let blocks = START_BLOCKS, citySeed = START_SEED, HALF, NL, LOTS, BLD, DOOR; // set by buildCity: city spans [-HALF, HALF]

// ===== RNG: mulberry32 =====
let rngState;
const rnd = () => { let t = rngState = rngState + 0x6D2B79F5 | 0; t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };

// ===== WORLD: blocks, lots, buildings and their doors =====
const blockEdge = i => -HALF + i * PITCH;                   // low edge of block i on either axis
const ring = (i, bit) => blockEdge(i) + RING + bit * RING_S; // ring line of block i: bit 0 low side, 1 high side
const lotBlock = g => [(g / NL | 0) / LPB | 0, (g % NL) / LPB | 0]; // lot index to its block (i, j)

// the building a body of radius r at (x, z) sinks into, as [instance offset, depth on x, depth on z], or 0 when clear
// only the building of the lot cell under the body can be reached, since every radius used is under SETBACK
function wall(x, z, r) {
  const cell = v => { v += HALF; const b = Math.floor(v / PITCH), l = Math.floor((v - b * PITCH - SW) / LOT); return b < 0 || b >= blocks || l < 0 || l >= LPB ? -1 : b * LPB + l };
  const gi = cell(x), gj = cell(z), o = (gi * NL + gj) * INST;
  if (gi < 0 || gj < 0) return 0;
  const ox = BLD[o + 2] + r - Math.abs(x - BLD[o]), oz = BLD[o + 3] + r - Math.abs(z - BLD[o + 1]);
  return ox > 0 && oz > 0 && [o, ox, oz];
}
// (x, z) moved out of the wall hit along its shallower side
const pushOut = ([o, ox, oz], x, z) => ox < oz ? [x + Math.sign(x - BLD[o]) * ox, z] : [x, z + Math.sign(z - BLD[o + 1]) * oz];

// lay out the city for the current blocks and seed, then repopulate it and put the player at the start corner
function buildCity() {
  rngState = citySeed; HALF = blocks * PITCH / 2; NL = blocks * LPB; LOTS = NL * NL;
  BLD = new Float32Array(LOTS * INST); // per lot: I = (cx, cz, half x, half z), J = (height, hue, 0, 0)
  DOOR = new Float32Array(LOTS * 4);   // per lot: door x, z, then its exit point on the ring x, z
  for (let gi = 0; gi < NL; gi++) for (let gj = 0; gj < NL; gj++) {
    const i = gi / LPB | 0, j = gj / LPB | 0, li = gi % LPB, lj = gj % LPB, g = gi * NL + gj;
    const cx = blockEdge(i) + SW + (li + .5) * LOT, cz = blockEdge(j) + SW + (lj + .5) * LOT, hx = LOT / 2 - SETBACK, hz = hx;
    const edge = Math.max(Math.abs(cx), Math.abs(cz)) / HALF;
    BLD.set([cx, cz, hx, hz, H_MIN + (H_MAX - H_MIN) * rnd() ** H_SKEW * (1 - edge * H_EDGE), rnd()], g * INST);
    const sides = [];               // sides facing a street: 0 low x, 1 high x, 2 low z, 3 high z
    if (!li) sides.push(0); if (li == LPB - 1) sides.push(1); if (!lj) sides.push(2); if (lj == LPB - 1) sides.push(3);
    const s = sides[rnd() * sides.length | 0], hi = s & 1, onX = s < 2; // onX: door on an x-facing wall
    DOOR.set(onX ? [cx + (hi ? hx : -hx), cz, ring(i, hi), cz] : [cx, cz + (hi ? hz : -hz), cx, ring(j, hi)], g * 4);
  }
  for (let n = 0; n < peopleCount; n++) spawnPerson(n);
  px = pz = ring(blocks >> 1, 0); py = vy = 0; jumpsLeft = JUMPS;
}

// ===== PEOPLE: the rule AI walks door to door on block rings, crossing only corner to corner; each brain steers off that path =====
const NI = new Float32Array(MAX_PEOPLE * INST); // instances: I = (x, z, heading, swing phase), J = (scale, shirt hue, 0, 0)
const ST = new Uint8Array(MAX_PEOPLE);          // state: 0 door to ring, 1 on the ring or crossing, 2 ring to door, 3 inside
const TG = new Int32Array(MAX_PEOPLE);          // target lot (while inside: the lot it is in)
const BI = new Int32Array(MAX_PEOPLE), BJ = new Int32Array(MAX_PEOPLE); // block it walks on
const WX = new Float32Array(MAX_PEOPLE), WZ = new Float32Array(MAX_PEOPLE); // current waypoint
const TM = new Float32Array(MAX_PEOPLE);        // seconds left inside
const SP = new Float32Array(MAX_PEOPLE);        // walking speed
const WT = new Float32Array(MAX_PEOPLE * BRAIN_N * BRAIN_IN), EL = new Float32Array(WT.length); // brain weights and their eligibility traces, per neuron then input
const VM = new Float32Array(MAX_PEOPLE * BRAIN_N); // membrane potentials, spike at 1
const DA = new Float32Array(MAX_PEOPLE), OF = new Float32Array(MAX_PEOPLE); // dopamine, steering offset from the path (rad, + is left)
const INPUT = new Float32Array(BRAIN_IN);       // the brain inputs of the person thinking now
let peopleCount = START_PEOPLE;
const near = (ax, az, bx, bz) => Math.abs(ax - bx) + Math.abs(az - bz) < EPS;
const onLine = (v, i) => Math.abs(v - ring(i, 0)) < EPS || Math.abs(v - ring(i, 1)) < EPS;
const direct = (ax, az, bx, bz, i, j) => Math.abs(ax - bx) < EPS && onLine(ax, i) || Math.abs(az - bz) < EPS && onLine(az, j); // same ring side
const go = (n, x, z) => { WX[n] = x; WZ[n] = z };

// a person inside a random building, leaving it within START_S
function spawnPerson(n) {
  const g = TG[n] = rnd() * LOTS | 0, o = n * INST;
  ST[n] = 3; TM[n] = rnd() * START_S; SP[n] = NPC_SPEED * (1 + (rnd() * 2 - 1) * NPC_SPEED_VAR);
  NI[o] = DOOR[g * 4]; NI[o + 1] = DOOR[g * 4 + 1]; NI[o + 4] = 0; NI[o + 5] = rnd();
  const w = n * BRAIN_N * BRAIN_IN; // a fresh brain
  for (let i = 0; i < BRAIN_N * BRAIN_IN; i++) { WT[w + i] = (rnd() * 2 - 1) * W_INIT; EL[w + i] = 0 }
  VM.fill(0, n * BRAIN_N, (n + 1) * BRAIN_N); DA[n] = OF[n] = 0;
}

// C row: add people inside buildings, or drop the newest
function adjustPeople(delta) {
  const next = clamp(peopleCount + delta, 0, MAX_PEOPLE);
  for (let n = peopleCount; n < next; n++) spawnPerson(n);
  peopleCount = next;
}

// next point along block (i, j)'s ring from (x, z) toward ring point (qx, qz): the target itself or the best corner
function ringStep(i, j, x, z, qx, qz) {
  if (direct(x, z, qx, qz, i, j)) return [qx, qz];
  let best, bestD = Infinity;
  for (let c = 4; c--;) {
    const cx = ring(i, c & 1), cz = ring(j, c >> 1), d = Math.abs(x - cx) + Math.abs(z - cz);
    if (d > EPS && direct(x, z, cx, cz, i, j) && d + Math.abs(cx - qx) + Math.abs(cz - qz) < bestD) { bestD = d + Math.abs(cx - qx) + Math.abs(cz - qz); best = [cx, cz] }
  }
  return best;
}

// leave the building it is in, toward a new random lot
function leave(n) {
  const g = TG[n], o = n * INST;
  [BI[n], BJ[n]] = lotBlock(g);
  TG[n] = rnd() * LOTS | 0;
  go(n, DOOR[g * 4 + 2], DOOR[g * 4 + 3]);
  ST[n] = 0; NI[o + 4] = 1;
}

// reached the waypoint: pick the next one
function arrive(n) {
  if (ST[n] == 2) { ST[n] = 3; TM[n] = INSIDE_MIN + rnd() * (INSIDE_MAX - INSIDE_MIN); NI[n * INST + 4] = 0; return }
  ST[n] = 1;
  const g = TG[n], [ti, tj] = lotBlock(g), i = BI[n], j = BJ[n], x = WX[n], z = WZ[n];
  let qx, qz;
  if (i == ti && j == tj) {
    qx = DOOR[g * 4 + 2]; qz = DOOR[g * 4 + 3];
    if (near(x, z, qx, qz)) { ST[n] = 2; return go(n, DOOR[g * 4], DOOR[g * 4 + 1]) }
  } else {
    const crossX = i != ti, s = crossX ? Math.sign(ti - i) : Math.sign(tj - j); // crossX: next crossing is along x
    const xb = crossX ? +(s > 0) : +(x > blockEdge(i) + B / 2);
    const zb = crossX ? (tj > j ? 1 : tj < j ? 0 : +(z > blockEdge(j) + B / 2)) : +(s > 0);
    qx = ring(i, xb); qz = ring(j, zb);
    if (near(x, z, qx, qz)) { // at the crossing corner: cross to the facing corner of the next block
      crossX ? BI[n] += s : BJ[n] += s;
      return go(n, ring(BI[n], crossX ? 1 - xb : xb), ring(BJ[n], crossX ? zb : 1 - zb));
    }
  }
  go(n, ...ringStep(i, j, x, z, qx, qz));
}

// one brain tick for person n walking heading a at (x, z); hurt is true when it hit a wall or the player this tick
// returns its new steering offset. Learning: dopamine x eligibility (recent input-and-spike pairings) changes each weight
function think(n, x, z, a, hurt, dt) {
  const qx = px - x, qz = pz - z, close = Math.max(0, 1 - Math.hypot(qx, qz, py) / PLAYER_SENSE), left = qx * Math.cos(a) - qz * Math.sin(a) > 0; // left: the player is on its left
  const feel = t => +!!wall(x + Math.sin(a + t) * FEEL, z + Math.cos(a + t) * FEEL, 0);
  INPUT.set([feel(FEEL_ANGLE), feel(0), feel(-FEEL_ANGLE), left * close, !left * close, 1]);
  const learn = LEARN * (DA[n] = hurt ? -1 : DA[n] + (DA_TONIC - DA[n]) * dt / DA_TAU) * dt, fade = Math.exp(-dt / ELIG_TAU); // learn: this tick's weight change per unit eligibility
  let turn = 0;
  for (let j = 0; j < BRAIN_N; j++) {
    const v = n * BRAIN_N + j, w = v * BRAIN_IN;
    let current = (rnd() * 2 - 1) * LIF_NOISE;
    for (let i = 0; i < BRAIN_IN; i++) current += WT[w + i] * INPUT[i];
    const spike = (VM[v] += (current - VM[v]) * dt / LIF_TAU) >= 1;
    if (spike) { VM[v] = 0; turn += j < BRAIN_N / 2 ? 1 : -1 }
    for (let i = 0; i < BRAIN_IN; i++) { EL[w + i] = EL[w + i] * fade + INPUT[i] * spike; WT[w + i] = Math.min(W_MAX, Math.max(-W_MAX, WT[w + i] + learn * EL[w + i])) }
  }
  return OF[n] = clamp(OF[n] * Math.exp(-dt / STEER_TAU) + turn * STEER_KICK, -STEER_MAX, STEER_MAX);
}

function updatePeople(dt) {
  for (let n = 0; n < peopleCount; n++) {
    const o = n * INST;
    if (ST[n] == 3) { if ((TM[n] -= dt) <= 0) leave(n); continue }
    const dx = WX[n] - NI[o], dz = WZ[n] - NI[o + 1], d = Math.hypot(dx, dz), step = SP[n] * dt, a = Math.atan2(dx, dz) + OF[n]; // a: the path's heading plus the brain's offset
    let turn = a - NI[o + 2]; turn -= Math.round(turn / TAU) * TAU; NI[o + 2] += clamp(turn, -NPC_TURN * dt, NPC_TURN * dt);
    if (d <= Math.max(step, ARRIVE)) { NI[o] = WX[n]; NI[o + 1] = WZ[n]; arrive(n) }
    else { NI[o] += Math.sin(a) * step; NI[o + 1] += Math.cos(a) * step }
    const hit = ST[n] == 1 && wall(NI[o], NI[o + 1], RADIUS); // walls are solid on the ring, not on the way to or from its own door
    if (hit) [NI[o], NI[o + 1]] = pushOut(hit, NI[o], NI[o + 1]);
    think(n, NI[o], NI[o + 1], a, !!hit || Math.hypot(px - NI[o], pz - NI[o + 1], py) < PLAYER_BUMP, dt);
    NI[o + 3] += step * STRIDE;
  }
}

// ===== PLAYER: tinyverse controls; buildings block below their roofs and hold you on top =====
const keys = {};
let px, pz, py, vy, yaw = 0, pitch = 0, jumpsLeft, flying = false, prevJump = false, moveX = 0, moveY = 0; // py is feet height
const held = (...names) => names.some(name => keys[name]);
const applyLookDelta = (dx, dy) => { yaw -= dx * LOOK_SENSITIVITY; pitch = clamp(pitch - dy * LOOK_SENSITIVITY, -PITCH_LIMIT, PITCH_LIMIT) };

function updatePlayer(dt) {
  const moveFwd = held('s') ? -1 : held('w') ? 1 : moveY, moveSide = held('d') ? -1 : held('a') ? 1 : moveX;
  const jump = held(' ', 'spacebar'), down = held('shift', 'control', 'c'), speed = (flying ? FLY_SPEED : WALK_SPEED) * dt;
  const sy = Math.sin(yaw), cy = Math.cos(yaw), wasY = py; // forward (sy, cy), left (cy, -sy)
  px = clamp(px + (sy * moveFwd + cy * moveSide) * speed, -HALF, HALF);
  pz = clamp(pz + (cy * moveFwd - sy * moveSide) * speed, -HALF, HALF);
  if (flying) { py += ((jump ? 1 : 0) - (down ? 1 : 0)) * FLY_LIFT * dt; vy = 0 }
  else {
    if (jump && !prevJump && jumpsLeft > 0) { vy = JUMP_VELOCITY; jumpsLeft-- }
    vy -= GRAVITY * dt; py += vy * dt;
  }
  let floor = 0;
  const hit = wall(px, pz, RADIUS), roof = hit && BLD[hit[0] + 4];
  if (hit) wasY >= roof - STEP_GRIP ? floor = roof : [px, pz] = pushOut(hit, px, pz); // over the roof it is the floor, beside it a wall
  if (flying) py = Math.max(py, floor);
  else if (py <= floor + STEP_GRIP && vy <= 0) { py = floor; vy = 0; jumpsLeft = JUMPS }
  prevJump = jump;
}

// ===== RENDER: one program, one unit mesh per kind, drawn instanced =====
const VS = `#version 300 es
layout(location=0)in vec3 p;layout(location=1)in float k;layout(location=2)in vec4 I;layout(location=3)in vec4 J;
uniform mat4 P,V;uniform float D;out vec3 w;out vec2 L;flat out float S;
void main(){
vec3 v=p;
if(D>1.5){
float a=sin(I.w)*${F(SWING)},s=k==1.||k==4.?a:-a,y=k<2.5?${F(HIP)}:${F(SHOULDER)},d=v.y-y,c=cos(s),e=sin(s);
if(k>.5)v.yz=vec2(y+d*c-v.z*e,d*e+v.z*c);
c=cos(I.z);e=sin(I.z);
v=vec3(v.x*c+v.z*e,v.y,v.z*c-v.x*e)*J.x+vec3(I.x,0,I.y);
}else v=vec3(I.x+v.x*I.z,v.y*J.x,I.y+v.z*I.w);
w=v;L=vec2(k,p.y);S=J.y;gl_Position=P*V*vec4(v,1);}`;
const FS = `#version 300 es
precision highp float;
in vec3 w;in vec2 L;flat in float S;uniform float D,H;uniform vec3 E;out vec4 o;
float h(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
void main(){
vec3 n=normalize(cross(dFdx(w),dFdy(w))),c;
if(D<.5){
n=vec3(0,1,0);
vec2 m=mod(w.xz+H,${F(PITCH)});
bool rx=m.x>${F(B)},rz=m.y>${F(B)};
float u=rx?m.y:m.x,v=rx?m.x:m.y;
c=rx||rz?vec3(.17,.17,.19):vec3(.5,.5,.48);
if(rx!=rz&&(u<${F(SW)}||u>${F(B - SW)})&&fract(v/${F(STRIPE)})<.5)c=vec3(.8);
}else if(D<1.5){
c=mix(vec3(.45,.42,.4),vec3(.72,.68,.62),S);
vec2 q=vec2(abs(n.x)>.5?w.z:w.x,w.y)/vec2(${F(WIN_W)},${F(FLOOR_H)}),f=fract(q);
if(abs(n.y)<.5&&w.y>${F(FLOOR_H)}&&f.x>.2&&f.x<.8&&f.y>.3&&f.y<.85)c=h(floor(q)+S*99.)>${F(LIT)}?vec3(1,.85,.55):vec3(.12,.15,.2);
}else c=L.x>.5&&L.x<2.5?vec3(.15,.17,.25):L.y>${F(HEAD_Y)}?vec3(.85,.65,.5):.5+.5*cos(6.28*(S+vec3(0,.33,.67)));
c*=.45+.55*max(dot(n,normalize(vec3(${SUN}))),0.);
o=vec4(mix(vec3(${SKY}),c,exp(-length(w-E)*${F(FOG)})),1);}`;

const canvas = document.getElementById('gl'), gl = canvas.getContext('webgl2'), pr = gl.createProgram();
for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS]]) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(pr, s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); // dev only
}
gl.linkProgram(pr); gl.useProgram(pr);
const U = name => gl.getUniformLocation(pr, name), uP = U('P'), uV = U('V'), uD = U('D'), uE = U('E'), uH = U('H');

// box faces as triangles: per vertex x, y, z, part tag
const box = (m, a, b, k) => {
  for (let f = 0; f < 6; f++) {
    const x = f >> 1, y = (x + 1) % 3, z = (x + 2) % 3;
    for (const q of [0, 1, 3, 0, 3, 2]) { const v = []; v[x] = f & 1 ? b[x] : a[x]; v[y] = q & 1 ? b[y] : a[y]; v[z] = q & 2 ? b[z] : a[z]; m.push(...v, k) }
  }
  return m;
};
const CUBE = box([], [-1, 0, -1], [1, 1, 1], 0); // scaled by I.zw and J.x in the shader
const BODY = [ // [min, max, tag]: 0 trunk and head, 1 and 2 legs, 3 and 4 arms; forward is +z
  [[-.2, .9, -.12], [.2, 1.5, .12], 0], [[-.12, 1.52, -.12], [.12, 1.78, .12], 0],
  [[-.18, 0, -.08], [-.02, .9, .08], 1], [[.02, 0, -.08], [.18, .9, .08], 2],
  [[-.3, .85, -.07], [-.2, 1.48, .07], 3], [[.2, .85, -.07], [.3, 1.48, .07], 4]];
const PERSON = BODY.reduce((m, [a, b, k]) => box(m, a, b, k), []);

function mesh(verts) {
  const vao = gl.createVertexArray(), ib = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, 0, 16, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, 0, 16, 12);
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  for (let a = 2; a < 4; a++) { gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 4, gl.FLOAT, 0, INST * 4, (a - 2) * 16); gl.vertexAttribDivisor(a, 1) }
  return { vao, ib, n: verts.length / 4, count: 0 };
}
// upload `count` instances from `data` into mesh m
const setInstances = (m, data, count, usage) => { gl.bindBuffer(gl.ARRAY_BUFFER, m.ib); gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, count * INST), usage); m.count = count };
const DRAWS = [mesh(CUBE), mesh(CUBE), mesh(PERSON)]; // index is the shader's mode D: 0 ground, 1 buildings, 2 people
const [GROUND, CITY, PEOPLE] = DRAWS;

// build the city and hand it to the GPU: ground size, buildings, the ground pattern's origin
function rebuildCity() {
  buildCity();
  setInstances(GROUND, new Float32Array([0, 0, HALF * 2, HALF * 2, 0, 0, 0, 0]), 1, gl.STATIC_DRAW);
  setInstances(CITY, BLD, LOTS, gl.STATIC_DRAW);
  gl.uniform1f(uH, HALF);
}

gl.enable(gl.DEPTH_TEST); gl.clearColor(...SKY, 1);
function resize() {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; gl.viewport(0, 0, canvas.width, canvas.height);
  const f = 1 / Math.tan(FOV / 2);
  gl.uniformMatrix4fv(uP, 0, [f * canvas.height / canvas.width, 0, 0, 0, 0, f, 0, 0, 0, 0, (FAR + NEAR) / (NEAR - FAR), -1, 0, 0, 2 * FAR * NEAR / (NEAR - FAR), 0]);
}

function draw() {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), e = [px, py + EYE, pz];
  const X = [-cy, 0, sy], Y = [-sp * sy, cp, -sp * cy], Z = [-sy * cp, -sp, -cy * cp], dot = a => a[0] * e[0] + a[1] * e[1] + a[2] * e[2]; // camera right, up, back
  gl.uniformMatrix4fv(uV, 0, [X[0], Y[0], Z[0], 0, X[1], Y[1], Z[1], 0, X[2], Y[2], Z[2], 0, -dot(X), -dot(Y), -dot(Z), 1]);
  gl.uniform3fv(uE, e);
  setInstances(PEOPLE, NI, peopleCount, gl.DYNAMIC_DRAW);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  DRAWS.forEach((m, mode) => { if (m.count) { gl.uniform1f(uD, mode); gl.bindVertexArray(m.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, m.n, m.count) } });
}

// ===== HUD: info panel and settings panel (tinyverse layout) =====
const byId = id => document.getElementById(id);
const on = (el, type, fn, opts) => el.addEventListener(type, fn, opts);
const label = (id, text) => { byId(id).textContent = text };
const show = (id, visible) => { byId(id).style.display = visible ? 'flex' : 'none' };
let fps = 0, fpsElapsed = 0, fpsFrames = 0, frameCount = 0;

function updateFps(dt) {
  fpsElapsed += dt; fpsFrames++;
  if (fpsElapsed >= .5) { fps = Math.round(fpsFrames / fpsElapsed); fpsElapsed = fpsFrames = 0 }
}

function updateInfoPanel() {
  let outside = 0;
  for (let n = 0; n < peopleCount; n++) outside += ST[n] != 3;
  label('info', `FPS ${fps} seed ${citySeed}\nblocks ${blocks} lots ${LOTS}\n${peopleCount}C (${outside} out/${peopleCount - outside} in)`);
}

const toggleFly = () => {
  flying = !flying;
  label('flyBtn', 'FLY: ' + +flying);
  vy = 0; keys[' '] = keys.shift = false;
  if (HAS_TOUCH) { show('jump', !flying); show('flyUp', flying); show('flyDown', flying) }
};

// ===== INPUT (tinyverse): keys, pointer lock or drag to look, touch joystick, look pad and hold buttons =====
const HAS_TOUCH = 'ontouchstart' in window || (navigator.maxTouchPoints | 0) > 0, PASSIVE = { passive: false };
const nub = byId('joy').querySelector('.nub');
let lookX = 0, lookY = 0, joyX = 0, joyY = 0, pointerLocked = false, dragging = false;
const lookFrom = p => { lookX = p.clientX; lookY = p.clientY };
const lookTo = p => { applyLookDelta(p.clientX - lookX, p.clientY - lookY); lookFrom(p) };
const joyMove = p => {
  const dx = p.clientX - joyX, dy = p.clientY - joyY, magnitude = Math.min(1, Math.hypot(dx, dy) / JOY_RADIUS), angle = Math.atan2(dy, dx);
  moveX = -Math.cos(angle) * magnitude; moveY = -Math.sin(angle) * magnitude;
  nub.style.transform = `translate(${Math.cos(angle) * magnitude * NUB_TRAVEL}px,${Math.sin(angle) * magnitude * NUB_TRAVEL}px)`;
};
const joyStart = p => { const rect = byId('joy').getBoundingClientRect(); joyX = rect.left + rect.width / 2; joyY = rect.top + rect.height / 2; joyMove(p) };
const joyEnd = () => { moveX = moveY = 0; nub.style.transform = '' };

// one touch per pad: start, move and end follow the finger that started it
function touchPad(id, start, move, end) {
  const el = byId(id);
  let touchId = null;
  on(el, 'touchstart', e => { const t = e.changedTouches[0]; touchId = t.identifier; start(t); e.preventDefault() }, PASSIVE);
  on(el, 'touchmove', e => { for (const t of e.changedTouches) if (t.identifier === touchId) { move(t); e.preventDefault() } }, PASSIVE);
  const stop = e => { for (const t of e.changedTouches) if (t.identifier === touchId) { touchId = null; end() } };
  on(el, 'touchend', stop); on(el, 'touchcancel', stop);
}

function bindInput() {
  if (HAS_TOUCH) {
    touchPad('joy', joyStart, joyMove, joyEnd);
    touchPad('look', lookFrom, lookTo, () => {});
    for (const [id, key] of [['jump', ' '], ['flyUp', ' '], ['flyDown', 'shift']])
      for (const [type, down] of [['touchstart', true], ['touchend', false], ['touchcancel', false]])
        on(byId(id), type, e => { keys[key] = down; e.preventDefault() }, PASSIVE);
  } else {
    for (const id of ['joy', 'look', 'jump']) show(id, false);
    on(canvas, 'click', () => canvas.requestPointerLock());
  }
  for (const [type, down] of [['keydown', true], ['keyup', false]]) on(window, type, e => { keys[e.key.toLowerCase()] = down });
  on(document, 'pointerlockchange', () => { pointerLocked = !!document.pointerLockElement });
  on(document, 'mousedown', e => { if (!pointerLocked) { dragging = true; lookFrom(e) } });
  on(document, 'mouseup', () => { dragging = false });
  on(document, 'mousemove', e => { if (pointerLocked) applyLookDelta(e.movementX || 0, e.movementY || 0); else if (dragging) lookTo(e) });
  for (const [id, handler] of [
    ['gear', () => byId('btns').classList.toggle('open')],
    ['flyBtn', toggleFly],
    ['resetBtn', () => { citySeed = Math.random() * 1e9 | 0; rebuildCity() }]
  ]) on(byId(id), 'click', handler);
  for (const [name, step, apply] of [
    ['scale', BLOCKS_STEP, d => { blocks = clamp(blocks + d, BLOCKS_MIN, BLOCKS_MAX); rebuildCity() }],
    ['pop', PEOPLE_STEP, adjustPeople]
  ]) {
    on(byId(name + 'Down'), 'click', () => apply(-step));
    on(byId(name + 'Up'), 'click', () => apply(step));
  }
  label('popDown', -PEOPLE_STEP); label('popUp', '+' + PEOPLE_STEP);
  on(window, 'resize', resize);
}

// ===== LOOP =====
let last = 0;
const frame = t => {
  const dt = Math.min(.05, (t - last) / 1e3); last = t;
  updateFps(dt); updatePeople(dt); updatePlayer(dt); draw();
  if (frameCount++ % INFO_FRAMES === 0) updateInfoPanel();
  requestAnimationFrame(frame);
};

// ===== INIT =====
bindInput();
resize();
rebuildCity();
requestAnimationFrame(frame);
</script>
</body>
