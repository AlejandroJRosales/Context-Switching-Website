<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>City</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #10131a;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  #panel {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(12, 15, 21, 0.82);
    font: 400 15px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: #e8e4dc;
    z-index: 10;
  }
  #panel.hidden { display: none; }
  #card { width: min(440px, calc(100vw - 48px)); }
  #card h1 {
    font-size: 30px; font-weight: 400; letter-spacing: 0.01em;
    margin: 0 0 6px;
  }
  #card p { margin: 0 0 22px; color: #9a958b; font-size: 14px; }
  #row { display: flex; gap: 8px; }
  #addr {
    flex: 1; min-width: 0;
    padding: 11px 13px;
    background: #191d26; color: #e8e4dc;
    border: 1px solid #2c323f; border-radius: 3px;
    font: inherit; font-size: 15px;
  }
  #addr:focus { outline: 2px solid #6f7f9c; outline-offset: -1px; border-color: transparent; }
  #go {
    padding: 11px 20px;
    background: #e8e4dc; color: #10131a;
    border: 0; border-radius: 3px;
    font: inherit; font-size: 15px; cursor: pointer;
  }
  #go:disabled { opacity: 0.45; cursor: default; }
  #status { margin: 16px 0 0; min-height: 1.5em; font-size: 14px; color: #9a958b; }
  #status.error { color: #d98b7a; }
  #keys { margin: 28px 0 0; font-size: 13px; color: #6f6b64; }

  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 400 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: rgba(232, 228, 220, 0.55);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    pointer-events: none; z-index: 5;
  }
  #dot {
    position: fixed; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    background: rgba(255,255,255,0.7); border-radius: 50%;
    pointer-events: none; z-index: 5; display: none;
  }
  #dot.on { display: block; }

  #stick {
    position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px;
    border: 1px solid rgba(232, 228, 220, 0.3); border-radius: 50%;
    pointer-events: none; z-index: 6; display: none;
  }
  #stick.on { display: block; }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    background: rgba(232, 228, 220, 0.28); border-radius: 50%;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="panel">
  <div id="card">
    <h1>City</h1>
    <p>Enter an address. Buildings within a few blocks are pulled from OpenStreetMap and extruded.</p>
    <div id="row">
      <input id="addr" type="text" value="350 5th Ave, New York, NY" placeholder="350 5th Ave, New York, NY" autocomplete="off">
      <button id="go">Load</button>
    </div>
    <p id="status"></p>
    <p id="keys">WASD to move, mouse to look, shift to run, space to jump, esc to return here.</p>
  </div>
</div>
<div id="dot"></div>
<div id="stick"><div id="knob"></div></div>
<div id="hud"></div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

let storedPlace = localStorage.getItem('lastPlace') ? JSON.parse(localStorage.getItem('lastPlace')) : null;
if (storedPlace) {
  document.getElementById('addr').value = storedPlace.label;
} 

const RADIUS_LADDER  = [600, 350, 200];   // half-extent tried in order, meters
const DEFAULT_LEVELS = 3;       // when a building has no height info at all
const METERS_PER_LVL = 3.2;
const EYE_HEIGHT     = 1;
const PLAYER_RADIUS  = 0.35;
const WALK_SPEED     = 50.0;
const RUN_SPEED      = 100.0;
const JUMP_SPEED     = 100.0;
const GRAVITY        = 22.0;
const GRID_CELL      = 24;      // collision broadphase cell size, meters
const OVERPASS_TIMEOUT_MS = 30000;
const OVERPASS_MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];
const NOMINATIM_URL  = 'https://nominatim.openstreetmap.org/search';


const panel  = document.getElementById('panel');
const addrEl = document.getElementById('addr');
const goEl   = document.getElementById('go');
const statEl = document.getElementById('status');
const hudEl  = document.getElementById('hud');
const dotEl  = document.getElementById('dot');
const stickEl = document.getElementById('stick');
const knobEl  = document.getElementById('knob');

function say(msg, isError) {
  statEl.textContent = msg;
  statEl.className = isError ? 'error' : '';
}


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c8);
scene.fog = new THREE.Fog(0x9fb4c8, 120, 900);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 2000);

scene.add(new THREE.HemisphereLight(0xbdd3e6, 0x4a4640, 1.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(-0.5, 1, 0.4).multiplyScalar(100);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.MeshLambertMaterial({ color: 0x5c5f57 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

let cityMesh = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});


const cache = new Map();

async function geocode(query) {
  const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query)}&format=json&limit=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Geocoder returned ${res.status}.`);
  const hits = await res.json();
  if (!hits.length) throw new Error('No match for that address.');
  return {
    lat: parseFloat(hits[0].lat),
    lon: parseFloat(hits[0].lon),
    label: hits[0].display_name
  };
}

// One attempt against one mirror. Errors tagged `fatal` stop the whole search
// (the query itself is wrong, so no mirror or radius will help).
async function overpassTry(url, query) {
  const host = new URL(url).hostname;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), OVERPASS_TIMEOUT_MS);
  try {
    const res = await fetch(url, {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      signal: ctrl.signal
    });
    if (res.status === 400) {
      throw Object.assign(new Error('Overpass rejected the query.'), { fatal: true });
    }
    if (!res.ok) throw new Error(`${host} returned ${res.status}`);
    return await res.json();
  } catch (err) {
    if (err.name === 'AbortError') throw new Error(`${host} timed out`);
    if (err instanceof TypeError) throw new Error(`${host} unreachable`);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// Try every mirror at the widest radius, then shrink and try them all again.
// 429 is a real rate limit; 504 usually means the box was too heavy; the
// ladder covers both without asking the user to guess which one happened.
async function fetchBuildings(lat, lon) {
  let lastErr = null;

  for (const radius of RADIUS_LADDER) {
    const dLat = radius / 110540;
    const dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
    const bbox = [lat - dLat, lon - dLon, lat + dLat, lon + dLon]
      .map(v => v.toFixed(6)).join(',');

    if (cache.has(bbox)) return { json: cache.get(bbox), radius };

    const q = `[out:json][timeout:30];(way["building"](${bbox});relation["building"](${bbox}););out geom;`;

    for (const url of OVERPASS_MIRRORS) {
      const host = new URL(url).hostname;
      say(`Fetching buildings within ${radius} m from ${host}…`);
      try {
        const json = await overpassTry(url, q);
        cache.set(bbox, json);
        return { json, radius };
      } catch (err) {
        if (err.fatal) throw err;
        lastErr = err;
      }
    }
  }

  const min = RADIUS_LADDER[RADIUS_LADDER.length - 1];
  throw new Error(
    `Every mirror failed, down to a ${min} m radius. Last: ${lastErr ? lastErr.message : 'unknown'}.`
  );
}

// ---------------------------------------------------------------- parsing

// "24", "24 m", "78'", "23.5 metres" -> meters, or null
function parseLength(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  const feet = s.match(/^([\d.]+)\s*(?:'|ft|feet)$/i);
  if (feet) return parseFloat(feet[1]) * 0.3048;
  const m = s.match(/^([\d.]+)/);
  if (!m) return null;
  const v = parseFloat(m[1]);
  return Number.isFinite(v) && v > 0 ? v : null;
}

function heightOf(tags) {
  if (!tags) return DEFAULT_LEVELS * METERS_PER_LVL;
  const direct = parseLength(tags.height) ?? parseLength(tags['building:height']);
  if (direct) return direct;
  // levels can be "4", "4.5", or occasionally "2;3"; take the first number
  const lv = parseLength(tags['building:levels']);
  if (lv) return lv * METERS_PER_LVL;
  return DEFAULT_LEVELS * METERS_PER_LVL;
}

function minHeightOf(tags) {
  if (!tags) return 0;
  return parseLength(tags.min_height) ?? (parseLength(tags['building:min_level']) ?? 0) * METERS_PER_LVL;
}

// Local equirectangular projection about (lat0, lon0). Meters, y-up, -z north.
function makeProjector(lat0, lon0) {
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180);
  const kz = 110540;
  return (lat, lon) => [(lon - lon0) * kx, -(lat - lat0) * kz];
}

// Pull outer rings out of the Overpass response as arrays of [x, z] plus tags.
function ringsFrom(json, project) {
  const out = [];

  for (const el of json.elements || []) {
    if (el.type === 'way' && el.geometry) {
      out.push({ pts: el.geometry.map(n => project(n.lat, n.lon)), tags: el.tags });
    } else if (el.type === 'relation' && el.members) {
      for (const mem of el.members) {
        // v1 renders outer rings only; inner rings (courtyards) are ignored
        if (mem.role === 'outer' && mem.geometry) {
          out.push({ pts: mem.geometry.map(n => project(n.lat, n.lon)), tags: el.tags });
        }
      }
    }
  }

  // close, de-dupe consecutive points, drop degenerate rings
  const clean = [];
  for (const r of out) {
    const p = [];
    for (const q of r.pts) {
      const last = p[p.length - 1];
      if (!last || Math.abs(last[0] - q[0]) > 1e-4 || Math.abs(last[1] - q[1]) > 1e-4) p.push(q);
    }
    if (p.length > 2) {
      const a = p[0], b = p[p.length - 1];
      if (Math.abs(a[0] - b[0]) < 1e-4 && Math.abs(a[1] - b[1]) < 1e-4) p.pop();
    }
    if (p.length >= 3) clean.push({ pts: p, tags: r.tags });
  }
  return clean;
}

function ringArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j][0] * pts[i][1]) - (pts[i][0] * pts[j][1]);
  }
  return a / 2;
}

// ---------------------------------------------------------------- build

function buildCity(rings) {
  const geoms = [];
  const walls = [];   // { pts, minX, maxX, minZ, maxZ } in world XZ
  let skipped = 0;

  for (const ring of rings) {
    if (Math.abs(ringArea(ring.pts)) < 4) { skipped++; continue; }   // slivers, map noise

    const top = heightOf(ring.tags);
    const base = Math.min(minHeightOf(ring.tags), top - 0.5);
    const depth = top - base;
    if (!(depth > 0.5)) { skipped++; continue; }

    // Shape lives in XY; after rotateX(-90) a shape point (px, py) lands at
    // world (px, 0, -py) and the extrusion runs along +Y.
    const shape = new THREE.Shape();
    shape.moveTo(ring.pts[0][0], -ring.pts[0][1]);
    for (let i = 1; i < ring.pts.length; i++) shape.lineTo(ring.pts[i][0], -ring.pts[i][1]);
    shape.closePath();

    let g;
    try {
      g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 1 });
    } catch (e) {
      skipped++;   // self-intersecting ring; earcut gave up
      continue;
    }
    g.rotateX(-Math.PI / 2);
    if (base > 0) g.translate(0, base, 0);

    // subtle per-building tint so facades read apart while walking
    const t = 0.72 + Math.random() * 0.24;
    const n = g.attributes.position.count;
    const col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      col[i * 3]     = 0.80 * t;
      col[i * 3 + 1] = 0.78 * t;
      col[i * 3 + 2] = 0.74 * t;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.deleteAttribute('uv');

    geoms.push(g);

    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const [x, z] of ring.pts) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    walls.push({ pts: ring.pts, minX, maxX, minZ, maxZ });
  }

  if (cityMesh) {
    scene.remove(cityMesh);
    cityMesh.geometry.dispose();
    cityMesh.material.dispose();
    cityMesh = null;
  }

  if (geoms.length) {
    const merged = mergeGeometries(geoms, false);
    for (const g of geoms) g.dispose();
    merged.computeBoundingSphere();
    cityMesh = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true }));
    scene.add(cityMesh);
  }

  buildGrid(walls);
  return { count: geoms.length, skipped };
}

// ---------------------------------------------------------------- collision

let grid = new Map();
let gridWalls = [];

function cellKey(cx, cz) { return cx + ',' + cz; }

function buildGrid(walls) {
  grid = new Map();
  gridWalls = walls;
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    const x0 = Math.floor(w.minX / GRID_CELL), x1 = Math.floor(w.maxX / GRID_CELL);
    const z0 = Math.floor(w.minZ / GRID_CELL), z1 = Math.floor(w.maxZ / GRID_CELL);
    for (let cx = x0; cx <= x1; cx++) {
      for (let cz = z0; cz <= z1; cz++) {
        const k = cellKey(cx, cz);
        let bucket = grid.get(k);
        if (!bucket) grid.set(k, bucket = []);
        bucket.push(i);
      }
    }
  }
}

function pointInRing(pts, x, z) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

const near = { x: 0, z: 0, d: 0 };
function closestOnRing(pts, x, z) {
  let best = Infinity, bx = x, bz = z;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    const dx = xi - xj, dz = zi - zj;
    const len2 = dx * dx + dz * dz;
    let t = len2 > 0 ? ((x - xj) * dx + (z - zj) * dz) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = xj + dx * t, pz = zj + dz * t;
    const d = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d < best) { best = d; bx = px; bz = pz; }
  }
  near.x = bx; near.z = bz; near.d = Math.sqrt(best);
  return near;
}

// Push the player circle out of any footprint it overlaps. A few passes so
// inside corners settle instead of ping-ponging between two walls.
function resolveCollisions(pos) {
  for (let pass = 0; pass < 3; pass++) {
    let moved = false;
    const cx = Math.floor(pos.x / GRID_CELL), cz = Math.floor(pos.z / GRID_CELL);
    const seen = new Set();

    for (let ox = -1; ox <= 1; ox++) {
      for (let oz = -1; oz <= 1; oz++) {
        const bucket = grid.get(cellKey(cx + ox, cz + oz));
        if (!bucket) continue;

        for (const idx of bucket) {
          if (seen.has(idx)) continue;
          seen.add(idx);
          const w = gridWalls[idx];
          const r = PLAYER_RADIUS;
          if (pos.x < w.minX - r || pos.x > w.maxX + r || pos.z < w.minZ - r || pos.z > w.maxZ + r) continue;

          const inside = pointInRing(w.pts, pos.x, pos.z);
          const c = closestOnRing(w.pts, pos.x, pos.z);

          if (inside) {
            // walk out to the nearest wall, then clear it by the player radius
            let dx = c.x - pos.x, dz = c.z - pos.z;
            const len = Math.hypot(dx, dz) || 1;
            pos.x = c.x + (dx / len) * r;
            pos.z = c.z + (dz / len) * r;
            moved = true;
          } else if (c.d < r) {
            let dx = pos.x - c.x, dz = pos.z - c.z;
            const len = Math.hypot(dx, dz) || 1;
            pos.x = c.x + (dx / len) * r;
            pos.z = c.z + (dz / len) * r;
            moved = true;
          }
        }
      }
    }
    if (!moved) break;
  }
}

// ---------------------------------------------------------------- controls

const player = {
  pos: new THREE.Vector3(0, EYE_HEIGHT, 0),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  grounded: true
};
const keys = new Set();
let active = false;

addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Space' && active) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

renderer.domElement.addEventListener('click', () => {
  if (IS_TOUCH) return;
  if (!panel.classList.contains('hidden')) return;
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  active = document.pointerLockElement === renderer.domElement;
  dotEl.classList.toggle('on', active);
  if (!active) keys.clear();
});

addEventListener('mousemove', e => {
  if (!active) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  const lim = Math.PI / 2 - 0.01;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});

addEventListener('keydown', e => {
  if (e.code === 'Escape' && !active) panel.classList.remove('hidden');
});

// ---------------------------------------------------------------- touch

// Left half of the screen is a floating stick; right half is look-drag, and a
// double tap there jumps. There is no pointer lock on mobile, so `active` is
// set by hand when the panel closes.
const IS_TOUCH = true;
const STICK_RADIUS = 55;          // px of travel for full tilt
const TAP_GAP_MS   = 300;

const touchMove = { x: 0, z: 0 };
let stickId = null, stickCx = 0, stickCy = 0;
let lookId = null, lookX = 0, lookY = 0;
let lastTapAt = 0, jumpQueued = false;

if (IS_TOUCH) {
  const el = renderer.domElement;

  el.addEventListener('pointerdown', e => {
    if (!active || e.pointerType !== 'touch') return;

    if (e.clientX < innerWidth / 2 && stickId === null) {
      stickId = e.pointerId;
      stickCx = e.clientX; stickCy = e.clientY;
      stickEl.style.left = stickCx + 'px';
      stickEl.style.top  = stickCy + 'px';
      knobEl.style.transform = 'translate(0px, 0px)';
      stickEl.classList.add('on');
    } else if (lookId === null) {
      lookId = e.pointerId;
      lookX = e.clientX; lookY = e.clientY;
      const now = performance.now();
      if (now - lastTapAt < TAP_GAP_MS) { jumpQueued = true; lastTapAt = 0; }
      else lastTapAt = now;
    }
  });

  el.addEventListener('pointermove', e => {
    if (e.pointerId === stickId) {
      let dx = e.clientX - stickCx, dy = e.clientY - stickCy;
      const d = Math.hypot(dx, dy);
      if (d > STICK_RADIUS) { dx *= STICK_RADIUS / d; dy *= STICK_RADIUS / d; }
      knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
      touchMove.x =  dx / STICK_RADIUS;
      touchMove.z = -dy / STICK_RADIUS;
    } else if (e.pointerId === lookId) {
      player.yaw   -= (e.clientX - lookX) * 0.005;
      player.pitch -= (e.clientY - lookY) * 0.005;
      const lim = Math.PI / 2 - 0.01;
      player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
      lookX = e.clientX; lookY = e.clientY;
    }
  });

  const endTouch = e => {
    if (e.pointerId === stickId) {
      stickId = null;
      touchMove.x = touchMove.z = 0;
      stickEl.classList.remove('on');
    } else if (e.pointerId === lookId) {
      lookId = null;
    }
  };
  el.addEventListener('pointerup', endTouch);
  el.addEventListener('pointercancel', endTouch);
}

const fwd = new THREE.Vector3();
const right = new THREE.Vector3();

function step(dt) {
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  let mx = 0, mz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    mz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  mz -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  mx -= 1;
  if (stickId !== null) { mx += touchMove.x; mz += touchMove.z; }

  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? RUN_SPEED : WALK_SPEED;
  const len = Math.hypot(mx, mz);
  if (len > 0 && active) {
    const scale = Math.min(len, 1) / len;   // cap at 1, keep partial stick tilt
    mx *= scale; mz *= scale;
    player.pos.x += (fwd.x * mz + right.x * mx) * speed * dt;
    player.pos.z += (fwd.z * mz + right.z * mx) * speed * dt;
  }

  if (player.grounded && active && (keys.has('Space') || jumpQueued)) {
    player.vel.y = JUMP_SPEED;
    player.grounded = false;
  }
  jumpQueued = false;
  player.vel.y -= GRAVITY * dt;
  player.pos.y += player.vel.y * dt;
  if (player.pos.y <= EYE_HEIGHT) {
    player.pos.y = EYE_HEIGHT;
    player.vel.y = 0;
    player.grounded = true;
  }

  resolveCollisions(player.pos);

  camera.position.copy(player.pos);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  step(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- load

let busy = false;

async function load(query) {
  if (busy || !query.trim()) return;
  busy = true;
  goEl.disabled = true;

  try {
    say('Looking up the address…');
    const place = await geocode(query);
    let rings = [];

    if (storedPlace === null || place.label != storedPlace.label) {
        const { json, radius } = await fetchBuildings(place.lat, place.lon);

        say('Building geometry…');
        const project = makeProjector(place.lat, place.lon);
        rings = ringsFrom(json, project);
        localStorage.setItem('lastPlace', JSON.stringify({ label: place.label, lat: place.lat, lon: place.lon, radius }));
        localStorage.setItem('lastRings', JSON.stringify(rings));
    } else {
        rings = JSON.parse(localStorage.getItem('lastRings'));
        const radius = storedPlace.radius;
    }

    const { count, skipped } = buildCity(rings);

    if (!count) {
      say(`That spot has no mapped buildings within ${radius} m. Try somewhere more built up.`, true);
      busy = false; goEl.disabled = false;
      return;
    }

    player.pos.set(0, EYE_HEIGHT, 0);
    player.vel.set(0, 0, 0);
    player.yaw = 0; player.pitch = 0;
    resolveCollisions(player.pos);   // in case the address lands inside a footprint

    hudEl.textContent =
      `${count} buildings for ${place.label.split(',').slice(0, 3).join(',').trim()}` +
      ` (${skipped ? `${skipped} skipped` : '0 skipped'})`;

    panel.classList.add('hidden');
    say('');
    if (IS_TOUCH) active = true;
    else renderer.domElement.requestPointerLock();
  } catch (err) {
    say(err.message || String(err), true);
  }

  busy = false;
  goEl.disabled = false;
}

goEl.addEventListener('click', () => load(addrEl.value));
addrEl.addEventListener('keydown', e => { if (e.key === 'Enter') load(addrEl.value); });
addrEl.focus();

if (IS_TOUCH) {
  document.getElementById('keys').textContent =
    'Left half to walk, drag the right half to look, double tap to jump.';
}
</script>
