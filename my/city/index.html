    wake();
  });

  el.addEventListener('pointermove', e => {
    if (e.pointerId === stickId) {
      let dx = e.clientX - stickCx, dy = e.clientY - stickCy;
      const d = Math.hypot(dx, dy);
      if (d > STICK_RADIUS) { dx *= STICK_RADIUS / d; dy *= STICK_RADIUS / d; }
      knobDx = dx; knobDy = dy; knobDirty = true;
      touchMove.x =  dx / STICK_RADIUS;
      touchMove.z = -dy / STICK_RADIUS;
    } else if (e.pointerId === lookId) {
      player.yaw   -= (e.clientX - lookX) * 0.005;
      player.pitch -= (e.clientY - lookY) * 0.005;
      const lim = Math.PI / 2 - 0.01;
      player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
      lookX = e.clientX; lookY = e.clientY;
    } else {
      return;
    }
    wake();
  });

  const endTouch = e => {
    if (e.pointerId === stickId) {
      stickId = null;
      touchMove.x = touchMove.z = 0;
      knobDirty = false;
      stickEl.classList.remove('on');
    } else if (e.pointerId === lookId) {
      lookId = null;
    }
    wake();
  };
  el.addEventListener('pointerup', endTouch);
  el.addEventListener('pointercancel', endTouch);
}

// ------------------------------------------------------------ fly

let flying = false;

// Altitude while flying, held rather than clicked, so it reads like the rest
// of the movement input instead of stepping the player up a fixed amount.
let climb = 0;

function holdClimb(btn, dir) {
  btn.addEventListener('pointerdown', e => {
    // capture, so a finger that slides off the button still releases it
    btn.setPointerCapture(e.pointerId);
    climb = dir;
    btn.classList.add('held');
    wake();
  });
  const release = () => {
    if (climb === dir) climb = 0;
    btn.classList.remove('held');
    btn.blur();
    wake();
  };
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
}
holdClimb(upEl, 1);
holdClimb(downEl, -1);

flyEl.addEventListener('click', () => {
  flying = !flying;
  flyEl.classList.toggle('flying', flying);
  climbEl.classList.toggle('on', flying);
  climb = 0;
  upEl.classList.remove('held');
  downEl.classList.remove('held');
  // otherwise the button keeps keyboard focus and the next space bar presses
  // it again instead of jumping
  flyEl.blur();
  player.vel.y = 0;
  player.grounded = false;   // re-decided on the next step either way
  wake();
});

// ------------------------------------------------------------- settings

// Presets stand in for the live clock and the live forecast. Where the
// forecast gave a sunrise and sunset, the hours are read off today's own sun,
// so Morning means the same place on the arc in December as in June. Without
// one they fall back to fixed hours.
const TIMES = ['Live', 'Dawn', 'Morning', 'Noon', 'Afternoon', 'Sunset', 'Night'];
const FALLBACK_HOURS = {
  Dawn: 6, Morning: 9, Noon: 12, Afternoon: 15, Sunset: 18.5, Night: 0
};

// cloud is what the sky and the sun intensity read; kind is the fog branch.
// Rain, Snow and Storm differ only in how much light they take out until
// there is something drawing precipitation.
const SKIES = {
  Live:     null,
  Clear:    { label: 'Clear',         kind: 'clear',  cloud: 0   },
  Cloudy:   { label: 'Partly cloudy', kind: 'cloudy', cloud: 45  },
  Overcast: { label: 'Overcast',      kind: 'cloudy', cloud: 100 },
  Fog:      { label: 'Fog',           kind: 'fog',    cloud: 100 },
  Rain:     { label: 'Rain',          kind: 'rain',   cloud: 90  },
  Snow:     { label: 'Snow',          kind: 'snow',   cloud: 85  },
  Storm:    { label: 'Thunderstorm',  kind: 'storm',  cloud: 100 }
};

let timePreset = 'Live';
let skyPreset  = 'Live';

// hours past local midnight for a named preset
function presetHour(name) {
  if (weather) {
    const rise = weather.sunrise / 60;
    const day  = weather.sunset / 60 - rise;
    if (name === 'Dawn')      return rise;
    if (name === 'Morning')   return rise + day * 0.25;
    if (name === 'Noon')      return rise + day * 0.5;
    if (name === 'Afternoon') return rise + day * 0.75;
    if (name === 'Sunset')    return weather.sunset / 60;
    if (name === 'Night')     return (rise + day * 0.5 + 12) % 24;
  }
  return FALLBACK_HOURS[name];
}

// the instant the sky is drawn for: the real one, or today at the preset hour.
// Shifting the true instant rather than building a date keeps the declination
// and the longitude term correct.
function skyInstant() {
  if (timePreset === 'Live') return new Date();
  const d = cityNow();
  const now = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
  return new Date(Date.now() + (presetHour(timePreset) - now) * 3600000);
}

// what the sky is built from: a preset if one is picked, else the forecast
function conditions() {
  return SKIES[skyPreset] || weather;
}

function chips(host, names, pick) {
  for (const name of names) {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => {
      pick(name);
      for (const other of host.children) other.classList.toggle('sel', other === b);
      b.blur();
      updateSky();
      refreshHud();
    });
    if (name === 'Live') b.classList.add('sel');
    host.appendChild(b);
  }
}

chips(timesEl, TIMES, n => { timePreset = n; });
chips(skiesEl, Object.keys(SKIES), n => { skyPreset = n; });

gearEl.addEventListener('click', () => {
  settingsEl.classList.toggle('on');
  gearEl.blur();
});

function showControls(on) {
  flyEl.classList.toggle('on', on);
  climbEl.classList.toggle('on', on && flying);
  gearEl.classList.toggle('on', on);
  if (!on) settingsEl.classList.remove('on');
}

const fwd = new THREE.Vector3();
const right = new THREE.Vector3();

function step(dt) {
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  let mx = 0, mz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    mz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  mz -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  mx -= 1;
  if (stickId !== null) { mx += touchMove.x; mz += touchMove.z; }

  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? RUN_SPEED : WALK_SPEED;
  const len = Math.hypot(mx, mz);
  let dx = 0, dz = 0;
  if (len > 0 && active) {
    const scale = Math.min(len, 1) / len;   // cap at 1, keep partial stick tilt
    mx *= scale; mz *= scale;
    dx = (fwd.x * mz + right.x * mx) * speed * dt;
    dz = (fwd.z * mz + right.z * mx) * speed * dt;
  }

  if (flying) {
    // collision is off while flying, so you can drift through walls and
    // roofs to look around; it takes over again when you land
    jumpQueued = false;
    player.pos.x += dx;
    player.pos.z += dz;
    player.vel.y = 0;
    player.grounded = false;
    player.pos.y += climb * speed * dt;
    player.pos.y = Math.max(player.pos.y, EYE_HEIGHT);   // stay out of the ground
  } else {
    // resolve horizontally before the vertical step, so the roof lookup below
    // runs on a position that is already clear of every wall
    moveAndCollide(player.pos, dx, dz);

    if (player.grounded && active && (keys.has('Space') || jumpQueued)) {
      player.vel.y = JUMP_SPEED;
      player.grounded = false;
    }
    jumpQueued = false;
    player.vel.y -= GRAVITY * dt;

    const fromFeet = player.pos.y - EYE_HEIGHT;
    player.pos.y += player.vel.y * dt;
    if (player.vel.y > 0) {
      // a jump indoors stops at the ceiling instead of carrying on through it
      // and landing on the roof
      const c = ceilingAt(player.pos.x, player.pos.z,
        fromFeet + EYE_HEIGHT + HEAD_CLEAR, player.pos.y + HEAD_CLEAR);
      if (c < Infinity) { player.pos.y = c - HEAD_CLEAR; player.vel.y = 0; }
    }
    const toFeet = player.pos.y - EYE_HEIGHT;

    // grounded is re-decided every frame now, so stepping off a roof edge drops
    // you instead of leaving a stale flag that would allow a mid-air jump
    player.grounded = false;
    if (player.vel.y <= 0) {
      const floorY = supportAt(player.pos.x, player.pos.z, fromFeet, toFeet);
      if (toFeet <= floorY) {
        player.pos.y = floorY + EYE_HEIGHT;
        player.vel.y = 0;
        player.grounded = true;
      }
    }
  }

  camera.position.copy(player.pos);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

// The loop only runs while something can change what is on screen: held
// movement input, the player in the air or still settling, or a pose / scene
// change since the last drawn frame. Otherwise it stops scheduling itself and
// input, resize, or a new scene wakes it again. A still scene is never redrawn.
let last = -1;
let rafId = 0;
let sceneDirty = true;
const drawnPos = new THREE.Vector3(NaN, NaN, NaN);
let drawnYaw = NaN, drawnPitch = NaN;

function wake() {
  if (!rafId) rafId = requestAnimationFrame(frame);
}

function movementHeld() {
  return stickId !== null || climb !== 0 || jumpQueued ||
    keys.has('KeyW') || keys.has('KeyA') || keys.has('KeyS') || keys.has('KeyD') ||
    keys.has('ArrowUp') || keys.has('ArrowDown') || keys.has('ArrowLeft') || keys.has('ArrowRight') ||
    keys.has('Space');
}

function frame(now) {
  rafId = 0;
  // first frame after a sleep: no elapsed time to integrate
  const dt = last < 0 ? 0 : Math.min(Math.max((now - last) / 1000, 0), 0.05);
  last = now;
  step(dt);

  if (knobDirty) {
    knobEl.style.transform = `translate(${knobDx}px, ${knobDy}px)`;
    knobDirty = false;
  }

  const rainDue = rainTick(dt, now);
  const posed = !player.pos.equals(drawnPos) || player.yaw !== drawnYaw || player.pitch !== drawnPitch;
  if (posed || sceneDirty || rainDue) {
    renderer.render(scene, camera);
    drawnPos.copy(player.pos); drawnYaw = player.yaw; drawnPitch = player.pitch;
    sceneDirty = false;
    rainDrawn = now;
  }

  // falling rain keeps the loop alive; a still scene with no rain sleeps
  const settled = !posed && (player.grounded || flying) && player.vel.y === 0;
  if (settled && !movementHeld() && !rainAnimating()) {
    last = -1;           // sleep until wake()
    return;
  }
  rafId = requestAnimationFrame(frame);
}

// anything that adds to, removes from, or re-textures the scene calls this
function invalidate() {
  sceneDirty = true;
  wake();
}
wake();

// ------------------------------------------------------------- weather

// Open-Meteo. No key, no sign-up, CORS open, free for non-commercial use.
// timezone=auto resolves the coordinates to their own zone, so every
// timestamp that comes back is that city's wall clock and utc_offset_seconds
// is the offset that produced it, DST included.
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
const WEATHER_TIMEOUT_MS = 8000;

// WMO 4677 codes. label is what the HUD shows, kind is the coarse group to
// branch on if sky colour, fog or particles get driven off this later.
const WMO = {
  0:  ['Clear',              'clear'],
  1:  ['Mainly clear',       'clear'],
  2:  ['Partly cloudy',      'cloudy'],
  3:  ['Overcast',           'cloudy'],
  45: ['Fog',                'fog'],
  48: ['Rime fog',           'fog'],
  51: ['Light drizzle',      'rain'],
  53: ['Drizzle',            'rain'],
  55: ['Heavy drizzle',      'rain'],
  56: ['Freezing drizzle',   'rain'],
  57: ['Freezing drizzle',   'rain'],
  61: ['Light rain',         'rain'],
  63: ['Rain',               'rain'],
  65: ['Heavy rain',         'rain'],
  66: ['Freezing rain',      'rain'],
  67: ['Freezing rain',      'rain'],
  71: ['Light snow',         'snow'],
  73: ['Snow',               'snow'],
  75: ['Heavy snow',         'snow'],
  77: ['Snow grains',        'snow'],
  80: ['Light showers',      'rain'],
  81: ['Showers',            'rain'],
  82: ['Violent showers',    'rain'],
  85: ['Snow showers',       'snow'],
  86: ['Heavy snow showers', 'snow'],
  95: ['Thunderstorm',       'storm'],
  96: ['Thunderstorm, hail', 'storm'],
  99: ['Thunderstorm, hail', 'storm']
};

// null until a place loads, and stays null if the request fails
let weather = null;

async function fetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat.toFixed(4),
    longitude: lon.toFixed(4),
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,is_day,' +
             'precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m',
    hourly: 'temperature_2m,weather_code,cloud_cover,precipitation_probability,wind_speed_10m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset',
    forecast_days: '3',
    timezone: 'auto',
    temperature_unit: 'fahrenheit',
    wind_speed_unit: 'mph',
    precipitation_unit: 'inch'
  });

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WEATHER_TIMEOUT_MS);
  let json;
  try {
    const res = await fetch(`${WEATHER_URL}?${params}`, { signal: ctl.signal });
    if (!res.ok) throw new Error(`Weather service returned ${res.status}.`);
    json = await res.json();
  } finally {
    clearTimeout(timer);
  }

  const c = json.current, d = json.daily;
  const [label, kind] = WMO[c.weather_code] || ['Unknown', 'clear'];

  return {
    offset:   json.utc_offset_seconds,     // city time minus UTC, in seconds
    zone:     json.timezone_abbreviation,
    code:     c.weather_code, label, kind,
    tempF:    c.temperature_2m,
    feelsF:   c.apparent_temperature,
    humidity: c.relative_humidity_2m,      // percent
    cloud:    c.cloud_cover,               // percent
    precip:   c.precipitation,             // inches in the last hour
    windMph:  c.wind_speed_10m,
    windFrom: c.wind_direction_10m,        // degrees the wind blows from
    isDay:    c.is_day === 1,
    highF:    d.temperature_2m_max[0],
    lowF:     d.temperature_2m_min[0],
    sunrise:  clockMinutes(d.sunrise[0]),  // minutes past local midnight
    sunset:   clockMinutes(d.sunset[0]),
    hourly:   json.hourly,                 // raw arrays, local wall clock
    daily:    d
  };
}

// Open-Meteo returns "2026-09-17T07:12" with no offset on the string, so read
// the digits rather than handing it to Date, which would treat it as browser
// local time.
function clockMinutes(iso) {
  return +iso.slice(11, 13) * 60 + +iso.slice(14, 16);
}

// Wall clock in the loaded city right now. The epoch is shifted by the city's
// offset, so read this with the getUTC* getters only. The plain getters would
// apply the browser's own offset a second time.
function cityNow() {
  return new Date(Date.now() + (weather ? weather.offset : 0) * 1000);
}

// minutes past local midnight, fractional. This is the value to drive a sun
// angle from: sunrise and sunset above are in the same units.
function cityMinutes() {
  const d = cityNow();
  return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;
}

function clockText(date) {
  const d = new Date(date.getTime() + (weather ? weather.offset : 0) * 1000);
  const h = d.getUTCHours();
  return `${(h + 11) % 12 + 1}:${String(d.getUTCMinutes()).padStart(2, '0')}` +
         ` ${h < 12 ? 'AM' : 'PM'}`;
}

function weatherText() {
  if (!weather) return '';
  return `${clockText(skyInstant())} ${weather.zone}  ${Math.round(weather.tempF)}\u00b0F ` +
         `${conditions().label}, wind ${Math.round(weather.windMph)} mph, ` +
         `high ${Math.round(weather.highF)} low ${Math.round(weather.lowF)}`;
}

// ----------------------------------------------------------------- sky

// Where the real sun is, for the loaded coordinates at a given instant. Low
// precision NOAA equations, good to roughly a tenth of a degree, which is
// finer than the lighting resolves.
//
// This wants the true UTC instant, not cityNow(): the hour angle already
// carries longitude, so a zone-shifted clock would apply the offset twice.
// Returned as east/north/up components of a unit vector plus the altitude in
// degrees, so no azimuth round trip is needed to point the light.
function solarVector(lat, lon, date) {
  const R = Math.PI / 180;
  const d = date.getTime() / 86400000 - 10957.5;      // days since J2000.0

  const L = (280.460 + 0.9856474 * d) * R;            // mean longitude
  const g = (357.528 + 0.9856003 * d) * R;            // mean anomaly
  const lam = L + 1.915 * R * Math.sin(g) + 0.020 * R * Math.sin(2 * g);
  const eps = (23.439 - 0.0000004 * d) * R;           // obliquity

  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const ra  = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));

  // Greenwich mean sidereal time, hours, then local, then the hour angle
  const gmst = 18.697374558 + 24.06570982441908 * d;
  const lst  = (gmst * 15 + lon) * R;
  const H    = lst - ra;

  const phi = lat * R;
  const up    =  Math.sin(dec) * Math.sin(phi) + Math.cos(dec) * Math.cos(H) * Math.cos(phi);
  const north =  Math.sin(dec) * Math.cos(phi) - Math.cos(dec) * Math.cos(H) * Math.sin(phi);
  const east  = -Math.cos(dec) * Math.sin(H);

  return { east, north, up, altDeg: Math.asin(up) / R };
}

// Sun altitude in degrees, then sky/fog colour, sun colour, sun intensity.
// The top row is the palette the scene shipped with, so a clear midday sky
// lands on the original look and everything else moves away from it.
const SKY = [
  [-12, 0x05070f, 0x2a3a5c, 0.00],
  [ -6, 0x101a2e, 0x46587c, 0.00],
  [ -2, 0x34405e, 0xc27a52, 0.06],
  [  0, 0x6e6b74, 0xff8c46, 0.35],
  [  4, 0x98979f, 0xffb271, 0.85],
  [ 12, 0x9fb0c4, 0xffe0bb, 1.35],
  [ 30, 0x9fb4c8, 0xfff2dd, 1.60]
];

const skyCol   = new THREE.Color();
const sunCol   = new THREE.Color();
const scratch  = new THREE.Color();
const OVERCAST = new THREE.Color(0x8b8f96);
const FOGGY    = new THREE.Color(0xb9bcc0);

// fills skyCol and sunCol, returns the clear-sky intensity for that altitude
function sampleSky(alt) {
  let i = 0;
  while (i < SKY.length - 2 && alt > SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1];
  const t = Math.min(Math.max((alt - a[0]) / (b[0] - a[0]), 0), 1);
  skyCol.setHex(a[1]).lerp(scratch.setHex(b[1]), t);
  sunCol.setHex(a[2]).lerp(scratch.setHex(b[2]), t);
  return a[3] + (b[3] - a[3]) * t;
}

let site = null;        // coordinates of the loaded place, for the sun
let skyMinute = -1;     // minute the sky was last rebuilt for

function updateSky() {
  if (!site) return;

  const s = solarVector(site.lat, site.lon, skyInstant());
  let power = sampleSky(s.altDeg);

  // cloud and fog only matter while there is daylight to flatten, so both
  // effects fade out through twilight rather than greying the night sky
  const day = Math.min(Math.max((s.altDeg + 6) / 12, 0), 1);
  const c = conditions();
  const cloud = c ? c.cloud / 100 : 0;
  const foggy = c && c.kind === 'fog';

  skyCol.lerp(OVERCAST, cloud * 0.65 * day);
  if (foggy) skyCol.lerp(FOGGY, 0.6 * day);
  power *= 1 - 0.7 * cloud - (foggy ? 0.2 : 0);

  // below the horizon the light is off, so its position stays true rather
  // than being clamped to the skyline
  sun.position.set(s.east, s.up, -s.north).multiplyScalar(100);
  sun.color.copy(sunCol);
  sun.intensity = Math.max(power, 0);

  scene.background.copy(skyCol);
  scene.fog.color.copy(skyCol);
  syncRain(day);
  invalidate();
}

// ---------------------------------------------------------------- rain
//
// One LineSegments draw: two vertices per drop, preallocated once at the
// largest count this device gets. Every drop's position is a pure function of
// time in the vertex shader, wrapped into a box that follows the camera, so
// the CPU only writes a handful of uniforms per frame and drops recycle
// themselves as they fall out of the box or the player walks on. Intensity
// changes move the draw range, never the buffers.
//
// Shelter: a small height map of the roofs around the player, re-rasterized
// from the building shells whenever the player crosses a ROOF_MAP_SNAP grid
// line. The fragment shader drops any part of a streak below the roof over
// it, so rain lands on roofs, never falls through into rooms, and is still
// seen through a doorway from inside.
//
// Driven by conditions(), the same source the sky reads, so the Weather
// presets and the live forecast both work. Built when rain starts and fully
// disposed when it stops.

const RAIN_MAX = matchMedia('(pointer: coarse)').matches ? 4000 : 10000;
const RAIN_SPAN = 44;           // box width and depth around the camera, meters
const RAIN_HEIGHT = 26;         // box height, centred a little above the eye
const RAIN_FPS_IDLE = 30;       // redraw cap while rain is the only thing moving
const RAIN_TIME_WRAP = 600;     // seconds; keeps the shader's float time small
const ROOF_MAP_N    = 128;      // texels per side of the shelter map
const ROOF_MAP_SIZE = 56;       // meters per side; the rain box plus snap slack
const ROOF_MAP_SNAP = 4;        // re-rasterize when the player crosses this grid

// relative intensity for a WMO code, when no measured rate is available
const RAIN_BY_CODE = {
  51: 0.25, 53: 0.4, 55: 0.55, 56: 0.3, 57: 0.5,
  61: 0.4, 63: 0.65, 65: 1, 66: 0.45, 67: 0.8,
  80: 0.45, 81: 0.7, 82: 1, 95: 0.85, 96: 0.9, 99: 1
};

let rain = null;                // { mesh, uniforms, roof, ... } while raining
let rainTime = 0;
let rainDrawn = 0;              // timestamp of the last frame drawn for rain alone

// 0 when it is not raining, else 0..1. A measured rate wins over the code;
// about 0.3 in/h is already heavy rain.
function rainState() {
  const c = conditions();
  if (!c || (c.kind !== 'rain' && c.kind !== 'storm')) return null;
  const code = c.code ?? (c.kind === 'storm' ? 95 : 63);
  let i = RAIN_BY_CODE[code] ?? 0.6;
  if (c.precip > 0) i = Math.min(Math.max(c.precip / 0.3, 0.12), 1);
  const drizzle = code >= 51 && code <= 57;
  return { intensity: i, drizzle, storm: c.kind === 'storm' };
}

function makeRain() {
  const n = RAIN_MAX;
  const seed = new Float32Array(n * 2 * 4);    // x, y phase, z, speed factor
  const tip = new Float32Array(n * 2);         // 0 = head of the drop, 1 = tail
  for (let i = 0; i < n; i++) {
    const sx = Math.random(), sy = Math.random(), sz = Math.random();
    const sp = 0.8 + Math.random() * 0.4;
    for (let k = 0; k < 2; k++) {
      const o = (i * 2 + k) * 4;
      seed[o] = sx; seed[o + 1] = sy; seed[o + 2] = sz; seed[o + 3] = sp;
      tip[i * 2 + k] = k;
    }
  }
  const g = new THREE.BufferGeometry();
  // position is required by three but unused; seed carries everything
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 2 * 3), 3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 4));
  g.setAttribute('tip', new THREE.BufferAttribute(tip, 1));
  // the box follows the camera, so bounds never matter; skip frustum culling
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), Infinity);

  const roofData = new Float32Array(ROOF_MAP_N * ROOF_MAP_N).fill(-1e4);
  const roof = new THREE.DataTexture(roofData, ROOF_MAP_N, ROOF_MAP_N, THREE.RedFormat, THREE.FloatType);
  roof.minFilter = roof.magFilter = THREE.NearestFilter;
  roof.needsUpdate = true;

  const uniforms = {
    uRoof:     { value: roof },
    uRoofArea: { value: new THREE.Vector3(0, 0, ROOF_MAP_SIZE) },   // x0, z0, size
    uTime:   { value: 0 },
    uCenter: { value: new THREE.Vector3() },
    uBox:    { value: new THREE.Vector3(RAIN_SPAN, RAIN_HEIGHT, RAIN_SPAN) },
    uVel:    { value: new THREE.Vector3(0, -8, 0) },   // per unit speed factor
    uLen:    { value: 0.09 },                          // streak = velocity * this
    uColor:  { value: new THREE.Color(0xc4ccd6) },
    uAlpha:  { value: 0.5 }
  };

  const m = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    vertexShader: `
      attribute vec4 seed;
      attribute float tip;
      uniform float uTime, uLen;
      uniform vec3 uCenter, uBox, uVel;
      varying float vA;
      varying vec3 vP;
      void main() {
        vec3 v = uVel * vec3(1.0, seed.w, 1.0);
        vec3 corner = uCenter - uBox * vec3(0.5, 0.4, 0.5);
        vec3 p = vec3(seed.x, seed.y, seed.z) * uBox + v * uTime;
        p = mod(p - corner, uBox) + corner;
        // fade at the sides and ends of the box so wrapping never pops
        vec2 d = abs(p.xz - uCenter.xz) / (uBox.xz * 0.5);
        float yEdge = (p.y - corner.y) / uBox.y;
        vA = (1.0 - smoothstep(0.6, 1.0, max(d.x, d.y)))
           * smoothstep(0.0, 0.08, yEdge) * (1.0 - smoothstep(0.85, 1.0, yEdge))
           * mix(1.0, 0.0, tip) * (0.6 + 0.4 * seed.w);
        p -= v * uLen * (0.7 + 0.6 * fract(seed.x * 57.3)) * tip;
        vP = p;
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uAlpha;
      uniform sampler2D uRoof;
      uniform vec3 uRoofArea;
      varying float vA;
      varying vec3 vP;
      void main() {
        vec2 uv = (vP.xz - uRoofArea.xy) / uRoofArea.z;
        if (uv.x >= 0.0 && uv.y >= 0.0 && uv.x < 1.0 && uv.y < 1.0 &&
            vP.y < texture2D(uRoof, uv).r) discard;   // under a roof
        gl_FragColor = vec4(uColor, uAlpha * vA);
        #include <colorspace_fragment>
      }`
  });

  const mesh = new THREE.LineSegments(g, m);
  mesh.frustumCulled = false;
  mesh.renderOrder = 10;      // after the opaque city, over the ground
  scene.add(mesh);
  return { mesh, uniforms, roof, roofData, roofShells: null, roofCx: NaN, roofCz: NaN, mark: null };
}

function disposeRain() {
  if (!rain) return;
  scene.remove(rain.mesh);
  rain.mesh.geometry.dispose();
  rain.mesh.material.dispose();
  rain.roof.dispose();
  rain = null;
  invalidate();
}

// Start, retune or stop the rain from the current conditions. Called wherever
// the sky is rebuilt, so presets, forecast changes and new places all land here.
function syncRain(daylight) {
  const st = rainState();
  if (!st) { disposeRain(); return; }
  if (!rain) rain = makeRain();

  const u = rain.uniforms;
  const i = st.intensity;
  const count = Math.round(RAIN_MAX * (0.15 + 0.85 * i));
  rain.mesh.geometry.setDrawRange(0, count * 2);

  // drizzle falls slowly in short strokes; real rain is 6-9 m/s
  const fall = st.drizzle ? 3 + 1.5 * i : 6.5 + 2.5 * i;
  // wind is a nudge, not a gale: a fraction of the reported speed, capped
  let wx = 0, wz = 0;
  if (weather && weather.windMph != null) {
    const toward = (weather.windFrom + 180) * Math.PI / 180;
    const s = Math.min(weather.windMph * 0.447 * 0.3 * (st.storm ? 1.5 : 1), 4);
    wx = Math.sin(toward) * s;       // +x east
    wz = -Math.cos(toward) * s;      // -z north
  }
  u.uVel.value.set(wx, -fall, wz);
  u.uLen.value = st.drizzle ? 0.05 : 0.08 + 0.03 * i;
  u.uAlpha.value = (st.drizzle ? 0.3 : 0.42 + 0.2 * i) * (0.35 + 0.65 * daylight);
  invalidate();
}

// Height of a shell's roof over (x, z), which is inside its footprint: the
// eaves for a flat roof, else the surface roofOf builds on the oriented box.
function roofHeightAt(s, x, z) {
  if (!s.roofShape) return s.top;
  const o = s.obb;
  const dx = x - o.cx, dz = z - o.cz;
  const u = Math.abs(dx * o.ux + dz * o.uz), v = dx * o.vx + dz * o.vz;
  const av = Math.abs(v);
  let f;
  if (s.roofShape === 'skillion') f = (v + o.hv) / (2 * o.hv);
  else if (s.roofShape === 'pyramidal') f = Math.min(1 - u / o.hu, 1 - av / o.hv);
  else {
    f = 1 - av / o.hv;
    if (s.roofShape === 'hipped') {
      const inset = Math.min(o.hv, o.hu * 0.9);
      f = Math.min(f, (o.hu - u) / inset);
    }
  }
  f = f < 0 ? 0 : f > 1 ? 1 : f;
  return s.top + (s.roofTop - s.top) * f;
}

// Fill the shelter map centred on (cx, cz) from the shells in reach. Only the
// texels inside each shell's bounds are tested, and shells come from the same
// broadphase grid the collision uses.
function rasterRoofs(cx, cz) {
  const N = ROOF_MAP_N, cell = ROOF_MAP_SIZE / N;
  const x0 = cx - ROOF_MAP_SIZE / 2, z0 = cz - ROOF_MAP_SIZE / 2;
  const data = rain.roofData;
  data.fill(-1e4);

  if (!rain.mark || rain.mark.length !== shells.length) rain.mark = new Uint8Array(shells.length);
  const mark = rain.mark;
  mark.fill(0);
  const gx0 = Math.floor(x0 / GRID_CELL), gx1 = Math.floor((x0 + ROOF_MAP_SIZE) / GRID_CELL);
  const gz0 = Math.floor(z0 / GRID_CELL), gz1 = Math.floor((z0 + ROOF_MAP_SIZE) / GRID_CELL);
  for (let gx = gx0; gx <= gx1; gx++) {
    for (let gz = gz0; gz <= gz1; gz++) {
      const bucket = shellGrid.get(cellKey(gx, gz));
      if (!bucket) continue;
      for (const idx of bucket) {
        if (mark[idx]) continue;
        mark[idx] = 1;
        const s = shells[idx];
        const i0 = Math.max(0, Math.floor((s.minX - x0) / cell)), i1 = Math.min(N - 1, Math.floor((s.maxX - x0) / cell));
        const j0 = Math.max(0, Math.floor((s.minZ - z0) / cell)), j1 = Math.min(N - 1, Math.floor((s.maxZ - z0) / cell));
        for (let j = j0; j <= j1; j++) {
          const z = z0 + (j + 0.5) * cell;
          for (let i = i0; i <= i1; i++) {
            const x = x0 + (i + 0.5) * cell;
            if (!pointInShell(s, x, z)) continue;
            const h = roofHeightAt(s, x, z);
            const k = j * N + i;
            if (h > data[k]) data[k] = h;
          }
        }
      }
    }
  }

  rain.roof.needsUpdate = true;
  rain.uniforms.uRoofArea.value.set(x0, z0, ROOF_MAP_SIZE);
  rain.roofCx = cx; rain.roofCz = cz; rain.roofShells = shells;
}

// Per frame, from frame(). Returns true when the rain needs a redraw even if
// nothing else changed.
function rainTick(dt, now) {
  if (!rain) return false;
  const cx = Math.round(player.pos.x / ROOF_MAP_SNAP) * ROOF_MAP_SNAP;
  const cz = Math.round(player.pos.z / ROOF_MAP_SNAP) * ROOF_MAP_SNAP;
  if (cx !== rain.roofCx || cz !== rain.roofCz || rain.roofShells !== shells) rasterRoofs(cx, cz);

  rainTime = (rainTime + dt) % RAIN_TIME_WRAP;
  rain.uniforms.uTime.value = rainTime;
  rain.uniforms.uCenter.value.copy(player.pos);
  return now - rainDrawn >= 1000 / RAIN_FPS_IDLE;
}

// Whether the loop has to keep running for the rain's sake.
function rainAnimating() {
  return rain !== null;
}

let hudPlace = '';
let clockTimer = null;

function refreshHud() {
  hudEl.textContent = hudPlace + (weather ? '\n' + weatherText() : '');
}

function tick() {
  refreshHud();   // DOM only, no invalidate needed for the clock itself
  // the sun moves a quarter of a degree a minute, so rebuilding the sky
  // any faster than that would wake the renderer for nothing
  const m = Math.floor(Date.now() / 60000);
  if (m !== skyMinute) { skyMinute = m; updateSky(); }
}

function startClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(tick, 1000);
}

// ---------------------------------------------------------------- load

let busy = false;

async function load(query) {
  if (busy || !query.trim()) return;
  busy = true;
  goEl.disabled = true;

  try {
    say('Looking up the address…');
    const place = await geocode(query);

    // runs alongside the Overpass fetch below; a missing forecast should
    // never stop the city from loading
    const pendingWeather = fetchWeather(place.lat, place.lon).catch(() => null);

    let features = null;
    let radius = storedPlace ? storedPlace.radius : RADIUS_LADDER[0];
    const cached = (storedPlace && place.label === storedPlace.label &&
                    storedPlace.v === FEATURES_VERSION)
      ? localStorage.getItem('lastFeatures')
      : null;

    if (cached) {
        features = JSON.parse(cached);
    } else {
        const fetched = await fetchBuildings(place.lat, place.lon);
        radius = fetched.radius;

        say('Building geometry…');
        const project = makeProjector(place.lat, place.lon);
        features = featuresFrom(fetched.json, project);
        try {
            // keep the in-memory copy in step with storage, so a later load in
            // this session compares against the place that is actually cached
            storedPlace = { label: place.label, lat: place.lat, lon: place.lon, radius, v: FEATURES_VERSION };
            localStorage.setItem('lastPlace', JSON.stringify(storedPlace));
            localStorage.setItem('lastFeatures', JSON.stringify(features));
        } catch (e) {
            // over quota: the scene is already built from what we have. Without
            // cached features there is nothing a later label match could reuse.
            localStorage.removeItem('lastFeatures');
            storedPlace = null;
        }
    }

    const { count, skipped } = buildCity(features);

    if (!count) {
      say(`That spot has no mapped buildings within ${radius} m. Try somewhere more built up.`, true);
      busy = false; goEl.disabled = false;
      return;
    }

    try {
        say('Fetching aerial imagery…');
        const proj = makeProjector(place.lat, place.lon);
        // the tile cache is the fallback when the image service has nothing
        // here, or cannot be reached
        buildImagery(await fetchOrtho(place.lat, place.lon, radius, proj)
          ?? await fetchImagery(place.lat, place.lon, radius, proj));
    } catch (e) {
        // no imagery over this spot, or the service is down; the scene stands
    }

    weather = await pendingWeather;
    site = { lat: place.lat, lon: place.lon };
    skyMinute = Math.floor(Date.now() / 60000);
    updateSky();    // the sun runs off the coordinates alone, forecast or not
    startClock();

    player.pos.set(0, EYE_HEIGHT, 0);
    player.vel.set(0, 0, 0);
    player.yaw = 0; player.pitch = 0;
    resolveCollisions(player.pos);   // in case the address lands inside a wall

    // Compile shaders (in parallel where the driver supports it) and upload
    // textures now, so the first walkable frame does not stall on them.
    say('Preparing scene…');
    camera.position.copy(player.pos);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
    try {
      await renderer.compileAsync(scene, camera);
      for (const m of layers) if (m.material && m.material.map) renderer.initTexture(m.material.map);
    } catch (e) {
      // purely a warm-up; the first render does the same work if this fails
    }

    hudPlace =
      `${count} buildings for ${place.label.split(',').slice(0, 3).join(',').trim()}` +
      ` (${skipped ? `${skipped} skipped` : '0 skipped'})`;
    refreshHud();

    panel.classList.add('hidden');
    showControls(true);
    say('');
    if (IS_TOUCH) active = true;
    else renderer.domElement.requestPointerLock();
  } catch (err) {
    say(err.message || String(err), true);
  }

  busy = false;
  goEl.disabled = false;
}

goEl.addEventListener('click', () => load(addrEl.value));
addrEl.addEventListener('keydown', e => { if (e.key === 'Enter') load(addrEl.value); });
addrEl.focus();

if (IS_TOUCH) {
  document.getElementById('keys').textContent =
    'Left half to walk, drag the right half to look, double tap to jump.';
}
</script>
