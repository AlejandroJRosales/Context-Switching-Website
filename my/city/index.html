<title>City</title>

  }

    position: absolute; left: 50%; top: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;

  }
  #fly, #gear, #climb button {
    padding: 12px 18px;

  }

    position: fixed; right: 18px; bottom: 62px; width: 74px;
    z-index: 6; display: none;
  }

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

let storedPlace = localStorage.getItem('lastPlace') ? JSON.parse(localStorage.getItem('lastPlace')) : null;

} 

const RADIUS_LADDER  = [600, 350, 200];   // half-extent tried in order, meters
const DEFAULT_LEVELS = 3;       // when a building has no height info at all
const METERS_PER_LVL = 3.2;
const EYE_HEIGHT     = 1;
const PLAYER_RADIUS  = 0.35;
const WALK_SPEED     = 10.0;
const RUN_SPEED      = 20.0;
const JUMP_SPEED     = 30.0;
const GRAVITY        = 22.0;
const GRID_CELL      = 24;      // collision broadphase cell size, meters
const LAND_EPS       = 0.01;    // slack so a snapped-to roof still reads as clear
const HEAD_CLEAR     = 0.15;    // top of the head above the eye
const SUBSTEP        = 0.25;    // max horizontal move per collision pass; kept under
                                // PLAYER_RADIUS so a fast step cannot skip a thin wall

// Enterable buildings. Every footprint becomes a hollow shell: wall pieces of
// real thickness around each ring, one doorway cut out of the outer ring, and
// floor / ceiling / roof caps triangulated from the footprint.
const WALL_T         = 0.3;     // exterior wall thickness, meters, measured inward
const WALL_T_MIN     = 0.06;    // thinnest a wall is retried at when mitres fold
const MITER_MAX      = 4;       // a sharp corner's mitre is clamped to this many thicknesses
const DOOR_W         = 1.2;
const DOOR_MIN_W     = 0.9;     // comfortably wider than 2 * PLAYER_RADIUS
const DOOR_H         = 2.2;
const PIER           = 0.35;    // solid wall kept beside a doorway when there is room
const PIER_MIN       = 0.12;
const FRAME_W        = 0.09;    // painted frame around the opening, flush with the wall
const FLOOR_Y        = 0.055;   // interior floor, just above every painted ground layer
const CEIL_GAP       = 0.02;    // ceiling hangs this far under the roof cap
const ENTRANCE_REACH = 1.2;     // an entrance node this close to an edge belongs to it
const ROAD_NEAR      = 35;      // a road or path within this of a wall counts as its street
const ROAD_FAR       = 300;     // fallback search for the nearest road of any kind
const ROAD_CELL      = 32;
const FEATURES_VERSION = 2;     // bump when featuresFrom changes shape; drops stale caches
const OVERPASS_TIMEOUT_MS = 50000;
const OVERPASS_QUERY_TIMEOUT = 45;   // seconds, server side
const OVERPASS_MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];
const NOMINATIM_URL  = 'https://nominatim.openstreetmap.org/search';

// USGS orthoimagery from The National Map. Public domain, no key, no quota.
// Courtesy credit: "USGS, USDA, The National Map: Orthoimagery."
//
// Two sources, tried in order. NAIP Plus is a dynamic image service whose
// mosaic averages 0.3 m per pixel and includes high-resolution urban
// orthoimagery, rendered to whatever size we ask for. The basemap tile cache
// is the fallback: it stops at 1:9,028 (zoom 16), which is about 2.4
// Mercator-metres per pixel, so roughly 1.8 m on the ground at mid latitudes
// — the source of the mush this replaces.
const ORTHO_URL   = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/ImageServer/exportImage';
const ORTHO_M_PX  = 0.5;          // ground metres per pixel to ask for
const ORTHO_MAX_PX = 4000;        // the service refuses anything larger
const ORTHO_TIMEOUT_MS = 12000;   // a big export takes the server a while

const IMAGERY_URL      = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile';
const IMAGERY_MAX_Z    = 16;
const IMAGERY_MIN_Z    = 12;
const IMAGERY_TILE_PX  = 256;
const IMAGERY_MAX_TILES = 100;
const IMAGERY_TIMEOUT_MS = 8000;
const IMAGERY_Y        = 0.004;   // beneath every painted ground layer

// The flat layers are all within a few centimetres of each other, which the
// depth buffer cannot resolve at any distance, so each one also gets a depth
// bias. Higher wins, and the base ground plane sits at 0.
const LAYER_BIAS = { imagery: 1, area: 2, water: 3, road: 4, path: 5, floor: 6 };


// ---------------------------------------------------------------- layer tables

// Flat layers all sit on the ground plane, so they get a fixed stacking order
// in y rather than fighting over the same depth.
const LAYER_Y = { area: 0.010, water: 0.018, road: 0.032, path: 0.048 };

const ROAD_WIDTH = {
  motorway: 14, trunk: 13, primary: 12, secondary: 10, tertiary: 9,
  motorway_link: 7, trunk_link: 7, primary_link: 6.5, secondary_link: 6, tertiary_link: 6,
  residential: 7, unclassified: 6.5, living_street: 6, service: 4.5, road: 6.5,
  pedestrian: 6, track: 3.5, footway: 2, path: 1.8, cycleway: 2.2, steps: 1.6, bridleway: 2
};
const PATH_KINDS = new Set(['pedestrian', 'track', 'footway', 'path', 'cycleway', 'steps', 'bridleway']);
const ROAD_COLOR = 0x3f4247;
const PATH_COLOR = 0x8c8578;

// leisure / landuse / natural values worth painting on the ground
const AREA_COLOR = {
  water: 0x3d6b85, wetland: 0x4f6b58, basin: 0x3d6b85, reservoir: 0x3d6b85,
  park: 0x53753f, garden: 0x5c8046, grass: 0x5c8046, village_green: 0x5c8046,
  recreation_ground: 0x578040, pitch: 0x4f7f45, playground: 0x8a7a55, golf_course: 0x578040,
  forest: 0x3c5a33, wood: 0x3c5a33, meadow: 0x6d8a4c, farmland: 0x8f8a5e,
  cemetery: 0x5d6a54, allotments: 0x6a7847, scrub: 0x5b6b45, sand: 0xc4b48c,
  orchard: 0x5f7f45, greenfield: 0x6d8a4c
};

const WATERWAY_WIDTH = { river: 14, canal: 9, stream: 3, ditch: 1.6, drain: 1.6 };

const BARRIER = {
  wall:           { h: 2.0, t: 0.36, color: 0xb5ad9f },
  city_wall:      { h: 4.0, t: 0.80, color: 0xb5ad9f },
  retaining_wall: { h: 1.4, t: 0.50, color: 0xb5ad9f },
  fence:          { h: 1.7, t: 0.10, color: 0x8a8272 },
  hedge:          { h: 1.6, t: 0.80, color: 0x44653a }
};

// fallbacks when a building carries a material but no colour
const WALL_MATERIAL_COLOR = {
  brick: 0xd9a58a, red_brick: 0xd39177, brick_block: 0xd9a58a,
  concrete: 0xdedcd6, cement_block: 0xd8d4cb, stone: 0xd8d1c2, sandstone: 0xe3c9a3,
  limestone: 0xe6e0cd, marble: 0xf0ece6, granite: 0xc8c5c2,
  glass: 0xbcd6e6, mirror: 0xc8dce8, metal: 0xcfd4d9, steel: 0xc7ccd2,
  wood: 0xd0a878, timber_framing: 0xdcc39c, plaster: 0xeae4d8, stucco: 0xe6dccb,
  plastic: 0xdedad0, tiles: 0xd9c3ae, vinyl_siding: 0xe4e0d5, asbestos: 0xdad7cf
};
const ROOF_MATERIAL_COLOR = {
  roof_tiles: 0xb0654a, tiles: 0xb0654a, clay: 0xb96b4e, terracotta: 0xb96b4e,
  slate: 0x7b828d, shingle: 0x8a7f70, asphalt: 0x6a6a6c, tar_paper: 0x5f5f63,
  bitumen: 0x5f5f63, gravel: 0xa39d8c, concrete: 0xc0bcb3, metal: 0xafb5bb,
  copper: 0x7fb3a0, zinc: 0xa8afb5, eternit: 0xb2afa8, thatch: 0xc0a56d,
  glass: 0xb6d0dc, wood: 0xbb9268
};

// what we can actually build on top of a footprint; everything else stays flat
const ROOF_SHAPE = {
  gabled: 'gabled', gable: 'gabled', gambrel: 'gabled', round: 'gabled',
  hipped: 'hipped', 'half-hipped': 'hipped', mansard: 'hipped',
  pyramidal: 'pyramidal', dome: 'pyramidal', onion: 'pyramidal',
  skillion: 'skillion', 'lean_to': 'skillion', monopitch: 'skillion'
};

const TREE_ROW_SPACING = 9;     // meters between trees sampled along a tree_row
const SIGN_COLS  = 8;           // sign atlas layout
const SIGN_CELL_W = 256;
const SIGN_CELL_H = 48;
const SIGN_MAX   = 192;

// Only ask Overpass for the land cover and barrier values we actually paint.
const LANDUSE_RE = 'grass|forest|meadow|farmland|cemetery|allotments|orchard|greenfield'
  + '|village_green|recreation_ground|basin|reservoir';
const LEISURE_RE = 'park|garden|pitch|playground|golf_course|recreation_ground';
const BARRIER_RE = Object.keys(BARRIER).join('|');


const panel  = document.getElementById('panel');
const addrEl = document.getElementById('addr');
const goEl   = document.getElementById('go');
const statEl = document.getElementById('status');
const hudEl  = document.getElementById('hud');
const dotEl  = document.getElementById('dot');
const stickEl = document.getElementById('stick');
const knobEl  = document.getElementById('knob');
const flyEl     = document.getElementById('fly');
const climbEl   = document.getElementById('climb');
const upEl      = document.getElementById('up');
const downEl    = document.getElementById('down');
const gearEl     = document.getElementById('gear');
const settingsEl = document.getElementById('settings');
const timesEl    = document.getElementById('times');
const skiesEl    = document.getElementById('skies');

function say(msg, isError) {
  statEl.textContent = msg;
  statEl.className = isError ? 'error' : '';
}


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c8);
scene.fog = new THREE.Fog(0x9fb4c8, 120, 900);

// near stays inside PLAYER_RADIUS so nothing clips, but 0.1 against a far
// of 2000 leaves far too little depth precision for coplanar ground layers
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.25, 2000);

scene.add(new THREE.HemisphereLight(0xbdd3e6, 0x4a4640, 1.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(-0.5, 1, 0.4).multiplyScalar(100);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.MeshLambertMaterial({ color: 0x5c5f57 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const layers = [];   // every mesh built for the current place

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  invalidate();   // setSize clears the drawing buffer, so redraw even if the pose is unchanged
});
renderer.domElement.addEventListener('webglcontextrestored', () => invalidate());


const cache = new Map();

async function geocode(query) {
  const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query)}&format=json&limit=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Geocoder returned ${res.status}.`);
  const hits = await res.json();
  if (!hits.length) throw new Error('No match for that address.');
  return {
    lat: parseFloat(hits[0].lat),
    lon: parseFloat(hits[0].lon),
    label: hits[0].display_name
  };
}

// One attempt against one mirror. Errors tagged `fatal` stop the whole search
// (the query itself is wrong, so no mirror or radius will help).
async function overpassTry(url, query) {
  const host = new URL(url).hostname;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), OVERPASS_TIMEOUT_MS);
  try {
    const res = await fetch(url, {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      signal: ctrl.signal
    });
    if (res.status === 400) {
      throw Object.assign(new Error('Overpass rejected the query.'), { fatal: true });
    }
    if (!res.ok) throw new Error(`${host} returned ${res.status}`);
    return await res.json();
  } catch (err) {
    if (err.name === 'AbortError') throw new Error(`${host} timed out`);
    if (err instanceof TypeError) throw new Error(`${host} unreachable`);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// Try every mirror at the widest radius, then shrink and try them all again.
// 429 is a real rate limit; 504 usually means the box was too heavy; the
// ladder covers both without asking the user to guess which one happened.
async function fetchBuildings(lat, lon) {
  let lastErr = null;

  for (const radius of RADIUS_LADDER) {
    const dLat = radius / 110540;
    const dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
    const bbox = [lat - dLat, lon - dLon, lat + dLat, lon + dLon]
      .map(v => v.toFixed(6)).join(',');

    if (cache.has(bbox)) return { json: cache.get(bbox), radius };

    // One trip for every layer we render. `out geom` gives ways and relation
    // members their coordinates inline, and nodes their own lat/lon.
    const q = `[out:json][timeout:${OVERPASS_QUERY_TIMEOUT}];(` +
      `way["building"](${bbox});relation["building"](${bbox});` +
      `way["highway"](${bbox});` +
      `way["natural"="water"](${bbox});relation["natural"="water"](${bbox});` +
      `way["waterway"](${bbox});` +
      `way["landuse"~"^(${LANDUSE_RE})$"](${bbox});relation["landuse"~"^(${LANDUSE_RE})$"](${bbox});` +
      `way["leisure"~"^(${LEISURE_RE})$"](${bbox});relation["leisure"~"^(${LEISURE_RE})$"](${bbox});` +
      `way["natural"="wetland"](${bbox});way["natural"="scrub"](${bbox});way["natural"="sand"](${bbox});` +
      `way["natural"="tree_row"](${bbox});` +
      `way["barrier"~"^(${BARRIER_RE})$"](${bbox});` +
      `node["natural"="tree"](${bbox});` +
      `node["amenity"](${bbox});node["shop"](${bbox});` +
      `node["highway"="street_lamp"](${bbox});` +
      `node["emergency"="fire_hydrant"](${bbox});` +
      `node["entrance"](${bbox});` +
      `);out geom;`;

    for (const url of OVERPASS_MIRRORS) {
      const host = new URL(url).hostname;
      say(`Fetching map data within ${radius} m from ${host}…`);
      try {
        const json = await overpassTry(url, q);
        cache.set(bbox, json);
        return { json, radius };
      } catch (err) {
        if (err.fatal) throw err;
        lastErr = err;
      }
    }
  }

  const min = RADIUS_LADDER[RADIUS_LADDER.length - 1];
  throw new Error(
    `Every mirror failed, down to a ${min} m radius. Last: ${lastErr ? lastErr.message : 'unknown'}.`
  );
}

// ---------------------------------------------------------------- parsing

// "24", "24 m", "78'", "7'4\"", "23.5 metres" -> meters, or null
function parseLength(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  // feet, with an optional inches part: 78', 7'4", 7 ft 4 in
  const imp = s.match(/^([\d.]+)\s*(?:'|ft|feet)\s*(?:([\d.]+)\s*(?:"|''|in|inch(?:es)?)\s*)?$/i);
  if (imp) {
    const v = parseFloat(imp[1]) * 0.3048 + (imp[2] ? parseFloat(imp[2]) * 0.0254 : 0);
    return Number.isFinite(v) && v > 0 ? v : null;
  }
  const m = s.match(/^([\d.]+)/);
  if (!m) return null;
  const v = parseFloat(m[1]);
  return Number.isFinite(v) && v > 0 ? v : null;
}

function heightOf(tags) {
  if (!tags) return DEFAULT_LEVELS * METERS_PER_LVL;
  // these are all ground-to-tallest-point already, so they win outright.
  // est_height sits below the surveyed tags but above any levels guess.
  const direct = parseLength(tags.height)
    ?? parseLength(tags['building:height'])
    ?? parseLength(tags.est_height);
  if (direct) return direct;
  // levels can be "4", "4.5", or occasionally "2;3"; take the first number
  const lv = parseLength(tags['building:levels']);
  if (lv) {
    // roof:height/roof:levels describe the roof alone, stacked on the walls
    const roof = parseLength(tags['roof:height'])
      ?? (parseLength(tags['roof:levels']) ?? 0) * METERS_PER_LVL;
    return lv * METERS_PER_LVL + roof;
  }
  return DEFAULT_LEVELS * METERS_PER_LVL;
}

function minHeightOf(tags) {
  if (!tags) return 0;
  return parseLength(tags.min_height) ?? (parseLength(tags['building:min_level']) ?? 0) * METERS_PER_LVL;
}

// Local equirectangular projection about (lat0, lon0). Meters, y-up, -z north.
function makeProjector(lat0, lon0) {
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180);
  const kz = 110540;
  return (lat, lon) => [(lon - lon0) * kx, -(lat - lat0) * kz];
}

// Ways carry their own geometry; relations expose it per member. Outer rings
// only; buildingPolysOf below adds the inner rings for buildings.
function geometriesOf(el) {
  if (el.type === 'way' && el.geometry) return [el.geometry];
  if (el.type === 'relation' && el.members) {
    return el.members.filter(m => m.role === 'outer' && m.geometry).map(m => m.geometry);
  }
  return [];
}

function closedGeom(g) {
  if (!g || g.length < 4) return false;
  const a = g[0], b = g[g.length - 1];
  return Math.abs(a.lat - b.lat) < 1e-9 && Math.abs(a.lon - b.lon) < 1e-9;
}

// Building polygons as { pts, holes? }. A multipolygon's inner members become
// courtyards of whichever outer ring contains them. Only inner ways that close
// on themselves are used; split inner rings would need stitching first.
function buildingPolysOf(el, project) {
  const polys = geometriesOf(el)
    .map(g => ({ pts: cleanPts(g, project, true), holes: [] }))
    .filter(p => p.pts.length >= 3);
  if (el.type === 'relation' && el.members) {
    for (const m of el.members) {
      if (m.role !== 'inner' || !closedGeom(m.geometry)) continue;
      const h = cleanPts(m.geometry, project, true);
      if (h.length < 3) continue;
      const host = polys.find(p => pointInRing(p.pts, h[0][0], h[0][1]));
      if (host) host.holes.push(h);
    }
  }
  for (const p of polys) if (!p.holes.length) delete p.holes;
  return polys;
}

// Project, de-dupe consecutive points, and for rings drop the repeated closing
// point. Returns [x, z] pairs.
function cleanPts(geom, project, closed) {
  const p = [];
  for (const n of geom) {
    const q = project(n.lat, n.lon);
    const last = p[p.length - 1];
    if (!last || Math.abs(last[0] - q[0]) > 1e-4 || Math.abs(last[1] - q[1]) > 1e-4) p.push(q);
  }
  if (closed && p.length > 2) {
    const a = p[0], b = p[p.length - 1];
    if (Math.abs(a[0] - b[0]) < 1e-4 && Math.abs(a[1] - b[1]) < 1e-4) p.pop();
  }
  return p;
}

function areaKindOf(tags) {
  for (const key of ['leisure', 'landuse', 'natural', 'amenity']) {
    const v = tags[key];
    if (v && AREA_COLOR[v] != null) return v;
  }
  return null;
}

// Sort the response into the layers the builders consume. Everything is plain
// arrays and numbers so the whole thing survives a JSON round trip into
// localStorage.
function featuresFrom(json, project) {
  const f = {
    buildings: [], roads: [], areas: [], waterways: [],
    trees: [], barriers: [], pois: [], props: [], entrances: []
  };

  for (const el of json.elements || []) {
    const tags = el.tags || {};

    if (el.type === 'node') {
      const [x, z] = project(el.lat, el.lon);
      // entrances feed door placement only; the node may still be a POI too
      if (tags.entrance) f.entrances.push({ x, z, main: tags.entrance === 'main' });
      if (tags.natural === 'tree') { f.trees.push({ x, z, tags }); continue; }
      if (tags.highway === 'street_lamp') { f.props.push({ x, z, kind: 'lamp' }); continue; }
      if (tags.emergency === 'fire_hydrant') { f.props.push({ x, z, kind: 'hydrant' }); continue; }
      if (tags.amenity === 'bench') { f.props.push({ x, z, kind: 'bench' }); continue; }
      if (tags.amenity || tags.shop) {
        const label = signLabel(tags);
        if (label) f.pois.push({ x, z, label });
      }
      continue;
    }

    if (tags.building) {
      for (const p of buildingPolysOf(el, project)) {
        f.buildings.push(p.holes ? { pts: p.pts, holes: p.holes, tags } : { pts: p.pts, tags });
      }
      continue;
    }

    if (tags.highway && ROAD_WIDTH[tags.highway]) {
      const pts = cleanPts(el.geometry || [], project, false);
      if (pts.length >= 2) f.roads.push({ pts, kind: tags.highway, width: parseLength(tags.width) });
      continue;
    }

    if (tags.barrier && BARRIER[tags.barrier]) {
      const pts = cleanPts(el.geometry || [], project, false);
      if (pts.length >= 2) f.barriers.push({ pts, kind: tags.barrier, height: parseLength(tags.height) });
      continue;
    }

    if (tags.natural === 'tree_row') {
      const pts = cleanPts(el.geometry || [], project, false);
      if (pts.length >= 2) {
        // walk the line and drop a tree every few meters
        let carry = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
          const seg = Math.hypot(x1 - x0, z1 - z0);
          if (seg < 1e-3) continue;
          for (let d = TREE_ROW_SPACING - carry; d < seg; d += TREE_ROW_SPACING) {
            const t = d / seg;
            f.trees.push({ x: x0 + (x1 - x0) * t, z: z0 + (z1 - z0) * t, tags });
          }
          carry = (carry + seg) % TREE_ROW_SPACING;
        }
      }
      continue;
    }

    if (tags.waterway && WATERWAY_WIDTH[tags.waterway]) {
      const pts = cleanPts(el.geometry || [], project, false);
      if (pts.length >= 2) {
        f.waterways.push({ pts, width: parseLength(tags.width) ?? WATERWAY_WIDTH[tags.waterway] });
      }
      continue;
    }

    const kind = areaKindOf(tags);
    if (kind) {
      for (const g of geometriesOf(el)) {
        const pts = cleanPts(g, project, true);
        if (pts.length >= 3) f.areas.push({ pts, kind });
      }
    }
  }

  // big areas first so a pitch inside a park still reads on top of it
  f.areas.sort((a, b) => Math.abs(ringArea(b.pts)) - Math.abs(ringArea(a.pts)));
  return f;
}

// "convenience" -> "Convenience". Used when a POI has a type but no name.
function prettify(v) {
  return String(v).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}

function signLabel(tags) {
  if (!tags) return null;
  if (tags.name) return tags.name;
  if (tags.brand) return tags.brand;
  if (tags.operator) return tags.operator;
  if (tags.shop && tags.shop !== 'yes') return prettify(tags.shop);
  if (tags.amenity && tags.amenity !== 'yes') return prettify(tags.amenity);
  return null;
}

const _col = new THREE.Color();

// OSM colour values are free text. Take hex and CSS names, ignore the rest
// rather than letting Color.setStyle warn and hand back the previous colour.
function cssColor(raw) {
  if (raw == null) return null;
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/.test(s)) return _col.setStyle(s).getHex();
  if (THREE.Color.NAMES[s] !== undefined) return THREE.Color.NAMES[s];
  return null;
}

function wallColorOf(tags) {
  if (!tags) return null;
  return cssColor(tags['building:colour'])
    ?? cssColor(tags.colour)
    ?? WALL_MATERIAL_COLOR[tags['building:material']]
    ?? WALL_MATERIAL_COLOR[tags['building:facade:material']]
    ?? null;
}

function roofColorOf(tags) {
  if (!tags) return null;
  return cssColor(tags['roof:colour'])
    ?? ROOF_MATERIAL_COLOR[tags['roof:material']]
    ?? null;
}

function ringArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j][0] * pts[i][1]) - (pts[i][0] * pts[j][1]);
  }
  return a / 2;
}

// ---------------------------------------------------------------- build

// ---------------------------------------------------------------- geometry helpers

// Table hexes are authored the way they should look, so they go through the
// same sRGB -> working space conversion a material colour would get.
function rgb(hex) {
  _col.setHex(hex);
  return [_col.r, _col.g, _col.b];
}

function newBuf() { return { pos: [], col: [] }; }

// `ref` is the direction the face should end up pointing. Winding is fixed to
// match it, which saves getting vertex order right by hand everywhere.
function pushTri(b, p0, p1, p2, c, ref) {
  const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
  const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
  const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
  // flip by swapping the last two corners; no temporary array per triangle
  const flip = (nx * ref[0] + ny * ref[1] + nz * ref[2]) < 0;
  const q1 = flip ? p2 : p1, q2 = flip ? p1 : p2;
  b.pos.push(p0[0], p0[1], p0[2], q1[0], q1[1], q1[2], q2[0], q2[1], q2[2]);
  b.col.push(c[0], c[1], c[2], c[0], c[1], c[2], c[0], c[1], c[2]);
}

function pushQuad(b, p0, p1, p2, p3, c, ref) {
  pushTri(b, p0, p1, p2, c, ref);
  pushTri(b, p0, p2, p3, c, ref);
}

function bufGeom(b) {
  if (!b.pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
  g.computeVertexNormals();
  return g;
}

function tint(g, c) {
  const n = g.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c[0]; arr[i * 3 + 1] = c[1]; arr[i * 3 + 2] = c[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}

// mergeGeometries refuses a mix of indexed and non-indexed inputs, so every
// group is flattened before it gets there.
function nonIndexed(g) {
  if (!g.index) return g;
  const flat = g.toNonIndexed();
  g.dispose();
  return flat;
}

const UP = [0, 1, 0];

function pushDisc(b, x, y, z, r, c) {
  const N = 6;
  for (let k = 0; k < N; k++) {
    const a0 = k / N * Math.PI * 2, a1 = (k + 1) / N * Math.PI * 2;
    pushTri(b, [x, y, z],
      [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r],
      [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r], c, UP);
  }
}

// Flat strip down a polyline, with a small patch at each interior joint so
// corners do not open up. Good enough without mitring.
function ribbon(b, pts, width, y, c) {
  const h = Math.max(width, 0.6) / 2;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
    const dx = x1 - x0, dz = z1 - z0;
    const len = Math.hypot(dx, dz);
    if (len < 0.05) continue;
    const nx = -dz / len * h, nz = dx / len * h;
    pushQuad(b,
      [x0 + nx, y, z0 + nz], [x1 + nx, y, z1 + nz],
      [x1 - nx, y, z1 - nz], [x0 - nx, y, z0 - nz], c, UP);
    if (i > 0) pushDisc(b, x0, y, z0, h, c);
  }
}

// Filled polygon lying on the ground. Same XY-shape convention as the
// building extrusions: a shape point (px, py) lands at world (px, 0, -py).
function areaGeom(pts, y, c) {
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], -pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], -pts[i][1]);
  shape.closePath();
  let g;
  try { g = new THREE.ShapeGeometry(shape, 1); } catch (e) { return null; }
  if (!g.attributes.position || g.attributes.position.count < 3) { g.dispose(); return null; }
  g.rotateX(-Math.PI / 2);
  g.translate(0, y, 0);
  g.deleteAttribute('uv');
  return tint(nonIndexed(g), c);
}

function bounds(pts) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const [x, z] of pts) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }
  return { minX, maxX, minZ, maxZ };
}

// ---------------------------------------------------------------- roofs

// Oriented box around a footprint, taking the longest edge as the long axis.
// Fine for the rectangular houses that carry roof:shape; anything less
// rectangular is rejected by the area-fit test at the call site.
function obbOf(pts) {
  let bi = 0, bl = -1;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    const d = Math.hypot(pts[j][0] - pts[i][0], pts[j][1] - pts[i][1]);
    if (d > bl) { bl = d; bi = i; }
  }
  if (bl <= 0) return null;
  const j = (bi + 1) % pts.length;
  let ux = (pts[j][0] - pts[bi][0]) / bl, uz = (pts[j][1] - pts[bi][1]) / bl;
  let vx = -uz, vz = ux;

  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
  for (const [x, z] of pts) {
    const a = x * ux + z * uz, b = x * vx + z * vz;
    if (a < minU) minU = a; if (a > maxU) maxU = a;
    if (b < minV) minV = b; if (b > maxV) maxV = b;
  }
  let hu = (maxU - minU) / 2, hv = (maxV - minV) / 2;
  const cu = (minU + maxU) / 2, cv = (minV + maxV) / 2;
  const cx = cu * ux + cv * vx, cz = cu * uz + cv * vz;

  if (hv > hu) {   // keep u as the long axis
    const tx = ux, tz = uz;
    ux = vx; uz = vz; vx = -tx; vz = -tz;
    const t = hu; hu = hv; hv = t;
  }
  if (hu < 0.5 || hv < 0.5) return null;
  return { cx, cz, ux, uz, vx, vz, hu, hv, area: 4 * hu * hv };
}

// Roof volume between `wallTop` and `top`, built on the oriented box.
function roofOf(b, o, wallTop, top, shape, c) {
  const p = (du, dv, y) => [o.cx + o.ux * du + o.vx * dv, y, o.cz + o.uz * du + o.vz * dv];

  const A = p(-o.hu, -o.hv, wallTop);   // corners of the eaves rectangle
  const B = p( o.hu, -o.hv, wallTop);
  const C = p( o.hu,  o.hv, wallTop);
  const D = p(-o.hu,  o.hv, wallTop);

  if (shape === 'pyramidal') {
    const apex = p(0, 0, top);
    pushTri(b, A, B, apex, c, [0, 1, 0]);
    pushTri(b, B, C, apex, c, [0, 1, 0]);
    pushTri(b, C, D, apex, c, [0, 1, 0]);
    pushTri(b, D, A, apex, c, [0, 1, 0]);
    return;
  }

  if (shape === 'skillion') {
    const Chi = p( o.hu, o.hv, top), Dhi = p(-o.hu, o.hv, top);
    pushQuad(b, A, B, Chi, Dhi, c, [0, 1, 0]);          // the slope
    pushTri(b, B, C, Chi, c, [o.ux, 0, o.uz]);          // triangular ends
    pushTri(b, A, Dhi, D, c, [-o.ux, 0, -o.uz]);
    pushQuad(b, C, D, Dhi, Chi, c, [o.vx, 0, o.vz]);    // the raised wall
    return;
  }

  // gabled and hipped share the two long slopes; hipped just pulls the ridge
  // in from each end, which turns the gable walls into triangles.
  const inset = shape === 'hipped' ? Math.min(o.hv, o.hu * 0.9) : 0;
  const R0 = p(-o.hu + inset, 0, top);
  const R1 = p( o.hu - inset, 0, top);

  pushQuad(b, A, B, R1, R0, c, [0, 1, 0]);   // the two long slopes
  pushQuad(b, C, D, R0, R1, c, [0, 1, 0]);
  pushTri(b, B, C, R1, c, [o.ux, 0, o.uz]);  // gable wall, or hip when inset
  pushTri(b, D, A, R0, c, [-o.ux, 0, -o.uz]);
}

// ---------------------------------------------------------------- build

function clearLayers() {
  invalidate();
  for (const m of layers) {
    scene.remove(m);
    // instanceMatrix / instanceColor live on the mesh, not the geometry, and
    // three only frees their GL buffers when the mesh itself is disposed
    if (m.isInstancedMesh) m.dispose();
    if (m.geometry) m.geometry.dispose();
    if (m.material) {
      if (m.material.map) m.material.map.dispose();
      m.material.dispose();
    }
  }
  layers.length = 0;
}

function addLayer(geoms, material) {
  if (!geoms.length) return null;
  let merged;
  try {
    merged = mergeGeometries(geoms, false);
  } catch (e) {
    merged = null;
  }
  for (const g of geoms) g.dispose();
  if (!merged) return null;
  merged.computeBoundingSphere();
  const mesh = new THREE.Mesh(merged, material);
  scene.add(mesh);
  layers.push(mesh);
  invalidate();
  return mesh;
}

function litMaterial(bias) {
  const m = new THREE.MeshLambertMaterial({ vertexColors: true });
  if (bias) {
    // pull this layer towards the viewer in depth-buffer units, which stays
    // effective however far away the polygon is
    m.polygonOffset = true;
    m.polygonOffsetFactor = -bias;
    m.polygonOffsetUnits = -bias;
  }
  return m;
}

// ---------------------------------------------------------------- building shells
//
// A building is no longer one extruded solid. Each footprint becomes:
//
//   footprint ─┬─ wall pieces     thick quads along every edge of every ring
//              ├─ doorway         a gap in one outer-ring piece, lintel above
//              ├─ floor           triangulated footprint at the base
//              └─ ceiling / roof  the same triangulation under and on the eaves
//
// The same wall pieces are pushed to the collision grid as small 4-point
// rings, so what you see and what you bump into are one list of quads.
//
// Rings are wound so the left-hand normal of every edge points into the wall
// material: outer rings positive, courtyard rings negative (ringArea sense).

function dedupeRing(pts) {
  const out = [];
  for (const p of pts) {
    const q = out[out.length - 1];
    if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.02) out.push(p);
  }
  while (out.length > 2) {
    const a = out[0], b = out[out.length - 1];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 0.02) break;
    out.pop();
  }
  return out;
}

function orientRing(pts, positive) {
  return (ringArea(pts) > 0) === positive ? pts : pts.slice().reverse();
}

// Inner outline of a wall of thickness t along `pts`, mitred at every vertex
// so neighbouring pieces meet without gaps or overlaps. For edge i, a0/a1 are
// how far along the edge the inner corners sit relative to the outer ones;
// the edge is only usable if its inner side still runs forwards.
function offsetRing(pts, t) {
  const n = pts.length, E = new Array(n), inner = new Array(n);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = pts[j][0] - pts[i][0], dz = pts[j][1] - pts[i][1];
    const L = Math.hypot(dx, dz);
    E[i] = { i, L, ux: dx / L, uz: dz / L, nx: -dz / L, nz: dx / L, a0: 0, a1: 0 };
  }
  for (let i = 0; i < n; i++) {
    const e0 = E[(i - 1 + n) % n], e1 = E[i];
    const d = 1 + e0.nx * e1.nx + e0.nz * e1.nz;
    let mx, mz;
    if (d < 0.05) { mx = e1.nx * t; mz = e1.nz * t; }   // edge doubles back on itself
    else { mx = (e0.nx + e1.nx) / d * t; mz = (e0.nz + e1.nz) / d * t; }
    const ml = Math.hypot(mx, mz), cap = MITER_MAX * t;
    if (ml > cap) { mx *= cap / ml; mz *= cap / ml; }
    inner[i] = [pts[i][0] + mx, pts[i][1] + mz];
  }
  let ok = true;
  for (let i = 0; i < n; i++) {
    const e = E[i], j = (i + 1) % n;
    e.a0 = (inner[i][0] - pts[i][0]) * e.ux + (inner[i][1] - pts[i][1]) * e.uz;
    e.a1 = (inner[j][0] - pts[j][0]) * e.ux + (inner[j][1] - pts[j][1]) * e.uz;
    if (e.L + e.a1 - e.a0 < 0.02) ok = false;
  }
  return { pts, inner, E, t, ok };
}

// Full thickness where the ring allows it, thinner for footprints whose short
// edges would fold the mitred inner outline over itself.
function wallRing(pts) {
  let R = offsetRing(pts, WALL_T);
  while (!R.ok && R.t * 0.5 >= WALL_T_MIN) R = offsetRing(pts, R.t * 0.5);
  return R;
}

function alongEdge(R, i, d) {
  const e = R.E[i], p = R.pts[i];
  return [p[0] + e.ux * d, p[1] + e.uz * d];
}

// Point on the inner side of edge i facing outer distance d.
function innerAt(R, i, d) {
  const e = R.E[i], qi = R.inner[i], qj = R.inner[(i + 1) % R.pts.length];
  const s = (d - e.a0) / (e.L + e.a1 - e.a0);
  return [qi[0] + (qj[0] - qi[0]) * s, qi[1] + (qj[1] - qi[1]) * s];
}

// Point in a footprint, courtyards excluded.
function pointInShell(s, x, z) {
  if (!pointInRing(s.pts, x, z)) return false;
  for (const h of s.holes) if (pointInRing(h, x, z)) return false;
  return true;
}

// One earcut pass per building, shared by floor, ceiling and roof caps.
function capOf(outer, holes) {
  const v2 = r => r.map(p => new THREE.Vector2(p[0], p[1]));
  let tris;
  try { tris = THREE.ShapeUtils.triangulateShape(v2(outer), holes.map(v2)); } catch (e) { return null; }
  if (!tris || !tris.length) return null;
  return { verts: outer.concat(...holes), tris };
}

function pushCap(b, cap, y, c, ref) {
  const v = cap.verts;
  for (const [i, j, k] of cap.tris) {
    pushTri(b, [v[i][0], y, v[i][1]], [v[j][0], y, v[j][1]], [v[k][0], y, v[k][1]], c, ref);
  }
}

// Vertical quad over the XZ segment a..c between heights y0 and y1.
function vquad(b, a, c, y0, y1, col, ref) {
  if (y1 - y0 < 1e-3 || Math.hypot(c[0] - a[0], c[1] - a[1]) < 1e-3) return;
  pushQuad(b, [a[0], y0, a[1]], [c[0], y0, c[1]], [c[0], y1, c[1]], [a[0], y1, a[1]], col, ref);
}

function pushSolid(solids, pts, base, top) {
  solids.push({ pts, ...bounds(pts), base, top, tags: null });
}

// ---------------------------------------------------------------- door placement

// Uniform grid over any list of { minX, maxX, minZ, maxZ }.
function gridOf(items, cell) {
  const g = new Map();
  for (let i = 0; i < items.length; i++) {
    const w = items[i];
    const x0 = Math.floor(w.minX / cell), x1 = Math.floor(w.maxX / cell);
    const z0 = Math.floor(w.minZ / cell), z1 = Math.floor(w.maxZ / cell);
    for (let cx = x0; cx <= x1; cx++) {
      for (let cz = z0; cz <= z1; cz++) {
        const k = cellKey(cx, cz);
        let bucket = g.get(k);
        if (!bucket) g.set(k, bucket = []);
        bucket.push(i);
      }
    }
  }
  return g;
}

// Every road and path segment, bucketed once per city. Paths weigh a little
// less, so a door prefers the footway in front of a house over the street
// behind its garden.
function roadIndex(roads) {
  const segs = [];
  for (const r of roads || []) {
    const half = (r.width ?? ROAD_WIDTH[r.kind] ?? 4) / 2;
    const wgt = PATH_KINDS.has(r.kind) ? 0.75 : 1;
    for (let i = 0; i < r.pts.length - 1; i++) {
      const [x0, z0] = r.pts[i], [x1, z1] = r.pts[i + 1];
      segs.push({ x0, z0, x1, z1, half, wgt,
        minX: Math.min(x0, x1), maxX: Math.max(x0, x1), minZ: Math.min(z0, z1), maxZ: Math.max(z0, z1) });
    }
  }
  return { segs, grid: gridOf(segs, ROAD_CELL) };
}

// Weighted distance from (x, z) to the edge of the nearest road within maxR,
// and the road-centre point it was measured to. Null when nothing is in range.
function nearestRoad(idx, x, z, maxR) {
  let best = Infinity, bx = 0, bz = 0;
  const cx0 = Math.floor((x - maxR) / ROAD_CELL), cx1 = Math.floor((x + maxR) / ROAD_CELL);
  const cz0 = Math.floor((z - maxR) / ROAD_CELL), cz1 = Math.floor((z + maxR) / ROAD_CELL);
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cz = cz0; cz <= cz1; cz++) {
      const bucket = idx.grid.get(cellKey(cx, cz));
      if (!bucket) continue;
      for (const k of bucket) {
        const s = idx.segs[k];
        const dx = s.x1 - s.x0, dz = s.z1 - s.z0;
        const l2 = dx * dx + dz * dz;
        let t = l2 > 0 ? ((x - s.x0) * dx + (z - s.z0) * dz) / l2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const px = s.x0 + dx * t, pz = s.z0 + dz * t;
        const raw = Math.hypot(x - px, z - pz);
        if (raw > maxR + s.half) continue;
        const d = Math.max(0, raw - s.half) * s.wgt;
        if (d < best) { best = d; bx = px; bz = pz; }
      }
    }
  }
  return best < Infinity ? { d: best, x: bx, z: bz } : null;
}

function pointIndex(list) {
  const items = list.map(p => ({ ...p, minX: p.x, maxX: p.x, minZ: p.z, maxZ: p.z }));
  return { items, grid: gridOf(items, ROAD_CELL) };
}

// Would a doorway here open straight into a neighbouring building? Terraces
// and shared party walls fail this, so doors go to the street side instead.
function blockedAt(self, x, z) {
  const bucket = shellGrid.get(cellKey(Math.floor(x / GRID_CELL), Math.floor(z / GRID_CELL)));
  if (!bucket) return false;
  for (const idx of bucket) {
    if (idx === self.index) continue;
    const s = shells[idx];
    if (x < s.minX || x > s.maxX || z < s.minZ || z > s.maxZ) continue;
    if (pointInShell(s, x, z)) return true;
  }
  return false;
}

// Where along edge i a doorway can be centred, and how wide it gets. The range
// keeps clear of the mitred corners so both piers stay proper quads; a short
// wall trades pier width, then door width, before it is ruled out.
function doorSpan(R, i) {
  const e = R.E[i];
  const lo0 = Math.max(e.a0, 0), hi0 = e.L + Math.min(e.a1, 0);
  const span = hi0 - lo0;
  if (span < DOOR_MIN_W) return null;
  let w = Math.min(DOOR_W, span - 2 * PIER_MIN);
  if (w < DOOR_MIN_W) w = Math.min(DOOR_W, span);
  const pier = Math.min(PIER, (span - w) / 2);
  return { lo: lo0 + pier + w / 2, hi: hi0 - pier - w / 2, w };
}

// Outward probe point a little in front of the wall at distance d along edge i.
function probeOut(R, i, d, off) {
  const e = R.E[i], p = alongEdge(R, i, d);
  return [p[0] - e.nx * off, p[1] - e.nz * off];
}

// Stages 2-4 of door selection over candidates carrying a probe point:
// nearest road or path close by, else whichever faces the nearest road at
// any distance, else the longest wall. Ties keep the lowest edge index.
function pickByRoads(cands, s, roads) {
  let best = null, bestD = Infinity;
  for (const k of cands) {
    const r = nearestRoad(roads, k.probe[0], k.probe[1], ROAD_NEAR);
    if (r && r.d < bestD) { bestD = r.d; best = k; }
  }
  if (best) return best;

  const far = nearestRoad(roads, (s.minX + s.maxX) / 2, (s.minZ + s.maxZ) / 2, ROAD_FAR);
  if (far) {
    for (const k of cands) {
      const d = Math.hypot(k.probe[0] - far.x, k.probe[1] - far.z);
      if (d < bestD) { bestD = d; best = k; }
    }
    return best;
  }

  for (const k of cands) if (k.len > -bestD) { bestD = -k.len; best = k; }
  return best;
}

// A door is { edge, d0, d1 } on one outer edge, or, for footprints made of
// edges too short to hold one (round towers traced in small steps), a run of
// consecutive edges opened whole: { run: Set, first, last }.
function chooseDoor(s, R, roads, ents) {
  const cands = [];
  for (let i = 0; i < R.pts.length; i++) {
    const sp = doorSpan(R, i);
    if (!sp) continue;
    const c = (sp.lo + sp.hi) / 2;
    cands.push({ i, lo: sp.lo, hi: sp.hi, w: sp.w, c, len: R.E[i].L, probe: probeOut(R, i, c, 1.0) });
  }
  const open = cands.filter(k => { const p = probeOut(R, k.i, k.c, 0.5); return !blockedAt(s, p[0], p[1]); });
  const pool = open.length ? open : cands;
  const make = (k, c) => {
    c = Math.min(Math.max(c, k.lo), k.hi);
    return { edge: k.i, d0: c - k.w / 2, d1: c + k.w / 2 };
  };

  if (pool.length) {
    // 1. a mapped entrance on (or right against) one of the usable walls
    let best = null, bestS = Infinity, bestC = 0;
    const cx0 = Math.floor((s.minX - ENTRANCE_REACH) / ROAD_CELL), cx1 = Math.floor((s.maxX + ENTRANCE_REACH) / ROAD_CELL);
    const cz0 = Math.floor((s.minZ - ENTRANCE_REACH) / ROAD_CELL), cz1 = Math.floor((s.maxZ + ENTRANCE_REACH) / ROAD_CELL);
    for (let cx = cx0; cx <= cx1; cx++) {
      for (let cz = cz0; cz <= cz1; cz++) {
        const bucket = ents.grid.get(cellKey(cx, cz));
        if (!bucket) continue;
        for (const idx of bucket) {
          const en = ents.items[idx];
          for (const k of pool) {
            const e = R.E[k.i], p = R.pts[k.i];
            let t = (en.x - p[0]) * e.ux + (en.z - p[1]) * e.uz;
            t = t < 0 ? 0 : t > e.L ? e.L : t;
            const d = Math.hypot(en.x - (p[0] + e.ux * t), en.z - (p[1] + e.uz * t));
            if (d > ENTRANCE_REACH) continue;
            const score = d - (en.main ? 10 : 0);
            if (score < bestS) { bestS = score; best = k; bestC = t; }
          }
        }
      }
    }
    if (best) return make(best, bestC);

    // 2-4. roads, then geometry
    const k = pickByRoads(pool, s, roads);
    return make(k, k.c);
  }

  // No single wall fits a door. Open a run of consecutive edges instead,
  // starting from the one the road logic prefers.
  const n = R.pts.length;
  const all = [];
  for (let i = 0; i < n; i++) all.push({ i, len: R.E[i].L, probe: probeOut(R, i, R.E[i].L / 2, 1.0) });
  const start = pickByRoads(all, s, roads).i;
  const run = new Set([start]);
  let len = R.E[start].L, last = start;
  while (len < DOOR_W && run.size < n - 2) {
    last = (last + 1) % n;
    run.add(last);
    len += R.E[last].L;
  }
  return { run, first: start, last };
}

// ---------------------------------------------------------------- wall pieces

// One solid stretch of wall: painted outside, plastered inside, one collider.
function wallPiece(ctx, o0, o1, i0, i1, y0, y1, out, inn) {
  vquad(ctx.buf, o0, o1, y0, y1, ctx.wc, out);
  vquad(ctx.buf, i0, i1, y0, y1, ctx.iw, inn);
  pushSolid(ctx.solids, [o0, o1, i1, i0], y0, y1);
}

// The wall over an opening, from the door head up to the eaves. The bottom
// FRAME_W of its outside face is painted as the frame's head.
function lintelPiece(ctx, o0, o1, i0, i1, doorTop, wallTop, out, inn) {
  if (wallTop - doorTop < 1e-3) return;
  const frameTop = Math.min(doorTop + FRAME_W, wallTop);
  vquad(ctx.buf, o0, o1, doorTop, frameTop, ctx.trim, out);
  vquad(ctx.buf, o0, o1, frameTop, wallTop, ctx.wc, out);
  vquad(ctx.buf, i0, i1, doorTop, wallTop, ctx.iw, inn);
  pushQuad(ctx.buf, [o0[0], doorTop, o0[1]], [o1[0], doorTop, o1[1]],
    [i1[0], doorTop, i1[1]], [i0[0], doorTop, i0[1]], ctx.trim, [0, -1, 0]);
  pushSolid(ctx.solids, [o0, o1, i1, i0], doorTop, wallTop);
}

// Walls for one ring. `door` is null for courtyard rings.
function ringWalls(ctx, R, door, base, wallTop, doorTop) {
  const n = R.pts.length;
  const frameTop = Math.min(doorTop + FRAME_W, wallTop);

  for (let i = 0; i < n; i++) {
    const e = R.E[i], j = (i + 1) % n;
    const p0 = R.pts[i], p1 = R.pts[j], q0 = R.inner[i], q1 = R.inner[j];
    const out = [-e.nx, 0, -e.nz], inn = [e.nx, 0, e.nz];

    if (door && door.run && door.run.has(i)) {
      lintelPiece(ctx, p0, p1, q0, q1, doorTop, wallTop, out, inn);
      continue;
    }
    if (!door || door.run || door.edge !== i) {
      wallPiece(ctx, p0, p1, q0, q1, base, wallTop, out, inn);
      continue;
    }

    // the door edge: pier | opening | pier, with the lintel above the opening
    const { d0, d1 } = door;
    const D0 = alongEdge(R, i, d0), D1 = alongEdge(R, i, d1);
    const X0 = innerAt(R, i, d0), X1 = innerAt(R, i, d1);
    const fl = Math.min(FRAME_W, d0), fr = Math.min(FRAME_W, e.L - d1);

    if (d0 > 1e-3) {
      const P = alongEdge(R, i, d0 - fl);
      vquad(ctx.buf, p0, P, base, wallTop, ctx.wc, out);
      vquad(ctx.buf, P, D0, base, frameTop, ctx.trim, out);
      vquad(ctx.buf, P, D0, frameTop, wallTop, ctx.wc, out);
      vquad(ctx.buf, q0, X0, base, wallTop, ctx.iw, inn);
      pushSolid(ctx.solids, [p0, D0, X0, q0], base, wallTop);
    }
    if (e.L - d1 > 1e-3) {
      const P = alongEdge(R, i, d1 + fr);
      vquad(ctx.buf, D1, P, base, frameTop, ctx.trim, out);
      vquad(ctx.buf, D1, P, frameTop, wallTop, ctx.wc, out);
      vquad(ctx.buf, P, p1, base, wallTop, ctx.wc, out);
      vquad(ctx.buf, X1, q1, base, wallTop, ctx.iw, inn);
      pushSolid(ctx.solids, [D1, p1, q1, X1], base, wallTop);
    }
    // jambs: the cut faces of the wall, which also close off a neighbouring
    // piece's end when the opening runs right up to a corner
    vquad(ctx.buf, D0, X0, base, doorTop, ctx.trim, [e.ux, 0, e.uz]);
    vquad(ctx.buf, D1, X1, base, doorTop, ctx.trim, [-e.ux, 0, -e.uz]);
    lintelPiece(ctx, D0, D1, X0, X1, doorTop, wallTop, out, inn);
  }

  if (door && door.run) {
    const ef = R.E[door.first], el = R.E[door.last];
    const s = door.first, t = (door.last + 1) % n;
    vquad(ctx.buf, R.pts[s], R.inner[s], base, doorTop, ctx.trim, [ef.ux, 0, ef.uz]);
    vquad(ctx.buf, R.pts[t], R.inner[t], base, doorTop, ctx.trim, [-el.ux, 0, -el.uz]);
  }
}

// ---------------------------------------------------------------- build

function buildCity(features) {
  clearLayers();

  const buf = newBuf();        // walls, jambs, roof caps, ceilings
  const roofBuf = newBuf();    // pitched roofs
  const floorBuf = newBuf();   // interior floors, depth-biased over the ground paint
  const list = [];
  let skipped = 0;

  // Pass 1: the shell record of every building, so door placement can ask
  // whether a wall backs onto a neighbour before any geometry exists.
  for (const ring of features.buildings) {
    const outer = orientRing(dedupeRing(ring.pts), true);
    if (outer.length < 3) { skipped++; continue; }
    const foot = Math.abs(ringArea(outer));
    if (foot < 4) { skipped++; continue; }   // slivers, map noise

    const tags = ring.tags || {};
    const top = heightOf(tags);
    const base = Math.min(minHeightOf(tags), top - 0.5);
    if (!(top - base > 0.5)) { skipped++; continue; }

    // A pitched roof eats the top of the walls; the walls stop at the eaves
    // and the roof volume covers the rest.
    let roofShape = ROOF_SHAPE[tags['roof:shape']] || null;
    let obb = null, wallTop = top;
    if (roofShape) {
      obb = obbOf(outer);
      // the oriented box stands in for the footprint, so only use it when the
      // two are close in area
      if (!obb || foot / obb.area < 0.72) roofShape = null;
    }
    if (roofShape) {
      let rh = parseLength(tags['roof:height'])
        ?? (parseLength(tags['roof:levels']) ?? 0) * METERS_PER_LVL;
      if (!rh) rh = Math.min(Math.max(obb.hv * 0.55, 1.2), 7);
      rh = Math.min(rh, (top - base) - 1.0);
      if (rh >= 0.6) wallTop = top - rh; else roofShape = null;
    }
    if (!(wallTop - base > 0.5)) { skipped++; continue; }

    const holes = (ring.holes || [])
      .map(h => orientRing(dedupeRing(h), false))
      .filter(h => h.length >= 3 && Math.abs(ringArea(h)) >= 1);
    const cap = capOf(outer, holes);
    if (!cap) { skipped++; continue; }   // self-intersecting ring; earcut gave up

    list.push({
      pts: outer, holes, ...bounds(outer), cap,
      base, top: wallTop, ceil: wallTop - CEIL_GAP, floor: base > 0.05 ? base : 0,
      roofTop: top, roofShape, obb, tags, door: null, doorTop: 0, index: list.length
    });
  }
  shells = list;
  shellGrid = gridOf(list, GRID_CELL);

  // Pass 2: geometry and colliders.
  const roads = roadIndex(features.roads);
  const ents = pointIndex(features.entrances || []);
  const iw = rgb(0xe4ded2), floorC = rgb(0x8f7358), ceilC = rgb(0xf1eee8), trim = rgb(0x4e3d30);
  const solids = [];

  for (const s of list) {
    const tags = s.tags;
    // a tagged colour or material is used as-is, with only a slight jitter;
    // everything else keeps the subtle random tint so facades read apart
    const named = wallColorOf(tags);
    let wc;
    if (named != null) {
      const c = rgb(named), k = 0.9 + Math.random() * 0.12;
      wc = [c[0] * k, c[1] * k, c[2] * k];
    } else {
      const t = 0.72 + Math.random() * 0.24;
      wc = [0.80 * t, 0.78 * t, 0.74 * t];
    }

    const wallH = s.top - s.base;
    let doorH = Math.min(DOOR_H, wallH - 0.3);
    if (doorH < EYE_HEIGHT + HEAD_CLEAR + 0.25) doorH = wallH;   // too low for a lintel
    s.doorTop = s.base + doorH;

    const R = wallRing(s.pts);
    s.door = chooseDoor(s, R, roads, ents);

    const ctx = { buf, solids, wc, iw, trim };
    ringWalls(ctx, R, s.door, s.base, s.top, s.doorTop);
    for (const h of s.holes) ringWalls(ctx, wallRing(h), null, s.base, s.top, s.doorTop);

    pushCap(buf, s.cap, s.top, wc, [0, 1, 0]);             // flat roof / eaves cap
    pushCap(buf, s.cap, s.ceil, ceilC, [0, -1, 0]);        // seen from inside
    pushCap(floorBuf, s.cap, s.base + FLOOR_Y, floorC, [0, 1, 0]);
    if (s.base > 0.05) pushCap(buf, s.cap, s.base, wc, [0, -1, 0]);   // raised: underside

    if (s.roofShape) {
      const rcHex = roofColorOf(tags);
      const rc = rcHex != null ? rgb(rcHex) : [wc[0] * 0.72, wc[1] * 0.70, wc[2] * 0.68];
      roofOf(roofBuf, s.obb, s.top, s.roofTop, s.roofShape, rc);
    }
  }

  const count = list.length;
  const geoms = [bufGeom(buf), bufGeom(roofBuf)].filter(Boolean);
  addLayer(geoms, litMaterial());
  const fg = bufGeom(floorBuf);
  if (fg) addLayer([fg], litMaterial(LAYER_BIAS.floor));

  buildGround(features);
  buildTrees(features.trees);
  const barrierBoxes = buildBarriers(features.barriers);
  buildProps(features.props);
  buildGrid(solids.concat(barrierBoxes));
  buildSigns(collectSigns(list, features.pois));
  return { count, skipped };
}

// Roads, paths, water and land cover, all flat on the ground plane. These go
// out as one mesh per layer rather than one merged mesh, because each needs
// its own depth bias to stop them fighting each other at a distance.
function buildGround(features) {
  const areaGeoms = [], waterGeoms = [];
  const roadBuf = newBuf(), pathBuf = newBuf(), waterBuf = newBuf();

  for (const a of features.areas) {
    const hex = AREA_COLOR[a.kind];
    if (hex == null) continue;
    const wet = a.kind === 'water' || a.kind === 'basin' || a.kind === 'reservoir';
    const g = areaGeom(a.pts, wet ? LAYER_Y.water : LAYER_Y.area, rgb(hex));
    if (g) (wet ? waterGeoms : areaGeoms).push(g);
  }

  const waterC = rgb(AREA_COLOR.water);
  for (const w of features.waterways) ribbon(waterBuf, w.pts, w.width, LAYER_Y.water, waterC);
  const wg = bufGeom(waterBuf);
  if (wg) waterGeoms.push(wg);

  const roadC = rgb(ROAD_COLOR), pathC = rgb(PATH_COLOR);
  for (const r of features.roads) {
    const isPath = PATH_KINDS.has(r.kind);
    const width = r.width ?? ROAD_WIDTH[r.kind];
    if (isPath) ribbon(pathBuf, r.pts, width, LAYER_Y.path, pathC);
    else ribbon(roadBuf, r.pts, width, LAYER_Y.road, roadC);
  }
  const rg = bufGeom(roadBuf), pg = bufGeom(pathBuf);

  addLayer(areaGeoms, litMaterial(LAYER_BIAS.area));
  addLayer(waterGeoms, litMaterial(LAYER_BIAS.water));
  if (rg) addLayer([rg], litMaterial(LAYER_BIAS.road));
  if (pg) addLayer([pg], litMaterial(LAYER_BIAS.path));
}

// One instanced trunk and one instanced crown for the whole scene.
function buildTrees(trees) {
  if (!trees || !trees.length) return;

  const trunkG = new THREE.CylinderGeometry(0.14, 0.2, 1, 6);
  trunkG.translate(0, 0.5, 0);
  const crownG = new THREE.IcosahedronGeometry(1, 0);
  const trunk = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: 0x6b5136 }), trees.length);
  const crown = new THREE.InstancedMesh(crownG, new THREE.MeshLambertMaterial({ color: 0xffffff }), trees.length);

  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const pos = new THREE.Vector3();
  const scl = new THREE.Vector3();
  const c = new THREE.Color();

  for (let i = 0; i < trees.length; i++) {
    const t = trees[i];
    const tags = t.tags || null;
    const h = Math.min(Math.max(parseLength(tags && tags.height) ?? (4.5 + Math.random() * 4), 2), 30);
    const crownR = Math.min(Math.max((parseLength(tags && tags.diameter_crown) ?? h * 0.55) / 2, 0.6), h * 0.45);
    const trunkH = h - crownR * 1.5;

    e.set(0, Math.random() * Math.PI * 2, 0);
    q.setFromEuler(e);

    pos.set(t.x, 0, t.z);
    scl.set(1, Math.max(trunkH, 0.5), 1);
    trunk.setMatrixAt(i, m.compose(pos, q, scl));

    pos.set(t.x, Math.max(trunkH, 0.5) + crownR * 0.55, t.z);
    scl.set(crownR, crownR * 1.15, crownR);
    crown.setMatrixAt(i, m.compose(pos, q, scl));
    crown.setColorAt(i, c.setHSL(0.24 + Math.random() * 0.07, 0.42, 0.20 + Math.random() * 0.09));
  }

  trunk.instanceMatrix.needsUpdate = true;
  crown.instanceMatrix.needsUpdate = true;
  if (crown.instanceColor) crown.instanceColor.needsUpdate = true;
  trunk.frustumCulled = false;
  crown.frustumCulled = false;
  scene.add(trunk); layers.push(trunk);
  scene.add(crown); layers.push(crown);
  invalidate();
}

// Walls, fences and hedges. Each segment is also handed back as a thin
// footprint so the collision grid treats it like any other ring.
function buildBarriers(list) {
  const geoms = [], boxes = [];
  if (!list) return boxes;

  for (const b of list) {
    const spec = BARRIER[b.kind];
    if (!spec) continue;
    const h = Math.min(Math.max(b.height ?? spec.h, 0.4), 12);
    const c = rgb(spec.color);

    for (let i = 0; i < b.pts.length - 1; i++) {
      const [x0, z0] = b.pts[i], [x1, z1] = b.pts[i + 1];
      const dx = x1 - x0, dz = z1 - z0;
      const len = Math.hypot(dx, dz);
      if (len < 0.2) continue;

      const g = new THREE.BoxGeometry(len, h, spec.t);
      g.deleteAttribute('uv');
      g.rotateY(Math.atan2(-dz, dx));
      g.translate((x0 + x1) / 2, h / 2, (z0 + z1) / 2);
      geoms.push(tint(nonIndexed(g), c));

      const t = Math.max(spec.t, 0.25) / 2;
      const nx = -dz / len * t, nz = dx / len * t;
      const pts = [[x0 + nx, z0 + nz], [x1 + nx, z1 + nz], [x1 - nx, z1 - nz], [x0 - nx, z0 - nz]];
      boxes.push({ pts, ...bounds(pts), base: 0, top: h, tags: null });
    }
  }

  addLayer(geoms, litMaterial());
  return boxes;
}

function box(w, h, d, x, y, z, yaw, c) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.deleteAttribute('uv');
  if (yaw) g.rotateY(yaw);
  g.translate(x, y, z);
  return tint(nonIndexed(g), c);
}

function cyl(rt, rb, h, x, y, z, c) {
  const g = new THREE.CylinderGeometry(rt, rb, h, 6);
  g.deleteAttribute('uv');
  g.translate(x, y + h / 2, z);
  return tint(nonIndexed(g), c);
}

// Street lamps, benches and hydrants. Decoration only — none of it collides.
function buildProps(list) {
  const geoms = [];
  if (!list) return;

  const post = rgb(0x50545c), lampHead = rgb(0xf5ead0);
  const wood = rgb(0x9b7648), iron = rgb(0x4d5157), hydrant = rgb(0xc0392b);

  for (const p of list) {
    if (p.kind === 'lamp') {
      geoms.push(cyl(0.07, 0.11, 4.6, p.x, 0, p.z, post));
      geoms.push(box(0.5, 0.18, 0.28, p.x, 4.7, p.z, 0, lampHead));
    } else if (p.kind === 'bench') {
      const yaw = Math.random() * Math.PI * 2;
      const s = Math.sin(yaw), co = Math.cos(yaw);
      geoms.push(box(1.7, 0.09, 0.5, p.x, 0.46, p.z, yaw, wood));
      geoms.push(box(1.7, 0.38, 0.07, p.x - s * 0.21, 0.68, p.z - co * 0.21, yaw, wood));
      geoms.push(box(0.07, 0.44, 0.44, p.x + co * 0.72, 0.22, p.z - s * 0.72, yaw, iron));
      geoms.push(box(0.07, 0.44, 0.44, p.x - co * 0.72, 0.22, p.z + s * 0.72, yaw, iron));
    } else if (p.kind === 'hydrant') {
      geoms.push(cyl(0.13, 0.16, 0.62, p.x, 0, p.z, hydrant));
      geoms.push(cyl(0.09, 0.13, 0.12, p.x, 0.62, p.z, hydrant));
    }
  }

  addLayer(geoms, litMaterial());
}

// ---------------------------------------------------------------- imagery

// Standard slippy-tile maths. ArcGIS serves these as /tile/{z}/{row}/{col},
// which is z/y/x rather than the usual z/x/y.
function tileOf(lat, lon, z) {
  const n = 2 ** z;
  const rad = lat * Math.PI / 180;
  return {
    x: (lon + 180) / 360 * n,
    y: (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n
  };
}
function tileLon(x, z) { return x / 2 ** z * 360 - 180; }
function tileLat(y, z) {
  return Math.atan(Math.sinh(Math.PI * (1 - 2 * y / 2 ** z))) * 180 / Math.PI;
}

// Resolves with the image or null, never rejects, so a missing tile leaves a
// hole rather than failing the whole mosaic. crossOrigin matters: without it
// the pixels are tainted and WebGL refuses to use them as a texture.
function loadImage(url, timeoutMs) {
  return new Promise(resolve => {
    const img = new Image();
    let settled = false;
    const finish = v => { if (!settled) { settled = true; resolve(v); } };
    img.crossOrigin = 'anonymous';
    img.onload = () => finish(img);
    img.onerror = () => finish(null);
    if (timeoutMs) setTimeout(() => finish(null), timeoutMs);
    img.src = url;
  });
}

// Web Mercator metres, which is what the image service wants for its bbox.
function mercator(lat, lon) {
  const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * 6378137;
  return [lon * Math.PI / 180 * 6378137, y];
}

// One export request covering the whole area, at whatever resolution we ask
// for rather than whatever the tile cache happens to hold.
async function fetchOrtho(lat, lon, radius, project) {
  const dLat = radius / 110540;
  const dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
  const north = lat + dLat, south = lat - dLat;
  const west = lon - dLon, east = lon + dLon;

  const [minX, minY] = mercator(south, west);
  const [maxX, maxY] = mercator(north, east);

  // the export is rendered in Mercator, so the requested size has to match
  // that box's aspect or the service stretches the result to fit
  const cap = Math.min(ORTHO_MAX_PX, renderer.capabilities.maxTextureSize);
  let w = Math.min(cap, Math.round(2 * radius / ORTHO_M_PX));
  let h = Math.min(cap, Math.round(w * (maxY - minY) / (maxX - minX)));
  w = Math.round(h * (maxX - minX) / (maxY - minY));
  if (!(w > 0 && h > 0)) return null;

  const url = `${ORTHO_URL}?bbox=${minX},${minY},${maxX},${maxY}`
    + `&bboxSR=3857&imageSR=3857&size=${w},${h}`
    + `&format=jpg&interpolation=RSP_BilinearInterpolation&f=image`;

  const img = await loadImage(url, ORTHO_TIMEOUT_MS);
  if (!img) return null;
  // decode now, off the main thread, instead of synchronously inside the
  // first texImage2D
  try { await img.decode(); } catch (e) { /* already usable after onload */ }

  const [westX, northZ] = project(north, west);
  const [eastX, southZ] = project(south, east);
  return { source: img, westX, eastX, northZ, southZ, w, h, kind: 'ortho' };
}

// Stitch the tiles covering the loaded radius into one canvas.
async function fetchImagery(lat, lon, radius, project) {
  const dLat = radius / 110540;
  const dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));

  // start at the deepest cached level and back off if the box needs too many
  let z = IMAGERY_MAX_Z, x0, x1, y0, y1;
  for (;;) {
    const nw = tileOf(lat + dLat, lon - dLon, z);
    const se = tileOf(lat - dLat, lon + dLon, z);
    x0 = Math.floor(nw.x); x1 = Math.floor(se.x);
    y0 = Math.floor(nw.y); y1 = Math.floor(se.y);
    if ((x1 - x0 + 1) * (y1 - y0 + 1) <= IMAGERY_MAX_TILES) break;
    if (z <= IMAGERY_MIN_Z) return null;   // too much ground to cover sensibly
    z--;
  }

  const cols = x1 - x0 + 1, rows = y1 - y0 + 1;
  const cv = document.createElement('canvas');
  cv.width = cols * IMAGERY_TILE_PX;
  cv.height = rows * IMAGERY_TILE_PX;
  const ctx = cv.getContext('2d');

  let got = 0;
  const jobs = [];
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      jobs.push(loadImage(`${IMAGERY_URL}/${z}/${ty}/${tx}`, 0).then(img => {
        if (!img) return;
        ctx.drawImage(img, (tx - x0) * IMAGERY_TILE_PX, (ty - y0) * IMAGERY_TILE_PX,
          IMAGERY_TILE_PX, IMAGERY_TILE_PX);
        got++;
      }));
    }
  }

  // whatever has arrived when the timer runs out is what gets used
  await Promise.race([
    Promise.all(jobs),
    new Promise(done => setTimeout(done, IMAGERY_TIMEOUT_MS))
  ]);
  if (!got) return null;

  // The corners go through the game's own projector rather than a Mercator
  // inverse, so the photo lines up with the buildings even where that
  // projection is not quite true to scale.
  const [westX, northZ] = project(tileLat(y0, z), tileLon(x0, z));
  const [eastX, southZ] = project(tileLat(y1 + 1, z), tileLon(x1 + 1, z));
  return { source: cv, westX, eastX, northZ, southZ, z, got, total: cols * rows, kind: 'tiles' };
}

// One textured quad under the scene. v runs north at the top of the canvas,
// which is what the default flipY already gives us.
function buildImagery(img) {
  if (!img) return;
  const g = new THREE.PlaneGeometry(img.eastX - img.westX, img.southZ - img.northZ);
  g.rotateX(-Math.PI / 2);
  g.translate((img.westX + img.eastX) / 2, IMAGERY_Y, (img.northZ + img.southZ) / 2);

  const tex = new THREE.Texture(img.source);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const mat = new THREE.MeshLambertMaterial({ map: tex });
  mat.polygonOffset = true;                       // see LAYER_BIAS
  mat.polygonOffsetFactor = -LAYER_BIAS.imagery;
  mat.polygonOffsetUnits = -LAYER_BIAS.imagery;

  const mesh = new THREE.Mesh(g, mat);
  scene.add(mesh);
  layers.push(mesh);
  invalidate();
}

// ---------------------------------------------------------------- signage

// Outward-facing normal and midpoint of one footprint edge. Winding is not
// guaranteed, so the normal is checked against the ring itself.
function edgeOutward(pts, i) {
  const j = (i + 1) % pts.length;
  const [x0, z0] = pts[i], [x1, z1] = pts[j];
  const len = Math.hypot(x1 - x0, z1 - z0);
  if (len < 1e-4) return null;
  let nx = (z1 - z0) / len, nz = -(x1 - x0) / len;
  const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
  if (pointInRing(pts, mx + nx * 0.2, mz + nz * 0.2)) { nx = -nx; nz = -nz; }
  return { i, mx, mz, nx, nz, len };
}

function longestEdge(pts) {
  let bi = -1, bl = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    const d = Math.hypot(pts[j][0] - pts[i][0], pts[j][1] - pts[i][1]);
    if (d > bl) { bl = d; bi = i; }
  }
  return bi < 0 ? null : edgeOutward(pts, bi);
}

function edgeNearest(pts, x, z) {
  let bi = -1, best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    const dx = xj - xi, dz = zj - zi;
    const l2 = dx * dx + dz * dz;
    let t = l2 > 0 ? ((x - xi) * dx + (z - zi) * dz) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = xi + dx * t, pz = zi + dz * t;
    const d = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d < best) { best = d; bi = i; }
  }
  return bi < 0 ? null : edgeOutward(pts, bi);
}

// `lift` is the lowest the sign may hang, used to keep it above a doorway.
function placeSign(edge, text, kind, eaves, lift) {
  if (!edge || !text) return null;
  const h = kind === 'number' ? 0.3 : 0.55;
  let y = kind === 'number'
    ? Math.min(2.1, eaves - 0.25)
    : Math.min(3.1, eaves - 0.45);
  if (lift && y - h / 2 < lift) {
    y = lift + h / 2;
    if (y + h / 2 > eaves - 0.05) return null;
  }
  if (y - h / 2 < 0.3) return null;
  if (edge.len < (kind === 'number' ? 0.8 : 1.6)) return null;
  return {
    x: edge.mx + edge.nx * 0.07, y, z: edge.mz + edge.nz * 0.07,
    nx: edge.nx, nz: edge.nz, h, text: String(text), kind
  };
}

// Signs are centred on their wall, so one on the door wall clears the door head.
function doorLift(w, edge) {
  const d = w.door;
  if (!d || !edge) return 0;
  const on = d.run ? d.run.has(edge.i) : d.edge === edge.i;
  return on ? w.doorTop + 0.12 : 0;
}

// A building's own name and house number go on its longest wall; a POI node
// goes on the wall of the building it sits in (or the nearest one).
function collectSigns(walls, pois) {
  const names = [], numbers = [];

  for (const w of walls) {
    const tags = w.tags;
    if (!tags) continue;
    const label = signLabel(tags);
    const edge = longestEdge(w.pts);
    if (label) {
      const s = placeSign(edge, label, 'name', w.top, doorLift(w, edge));
      if (s) names.push(s);
    }
    if (tags['addr:housenumber']) {
      const s = placeSign(edge, tags['addr:housenumber'], 'number', w.top, doorLift(w, edge));
      if (s) numbers.push(s);
    }
  }

  // Candidates come from the shell grid, whose indices are positions in
  // `walls`. Sorting them keeps the original order, so ties and the early
  // `break` resolve exactly as a full scan would.
  const REACH = 15;
  const cand = [];
  const mark = new Uint32Array(walls.length);
  let stamp = 0;
  for (const p of pois || []) {
    let hit = null, best = Infinity;
    stamp++;
    cand.length = 0;
    const cx0 = Math.floor((p.x - REACH) / GRID_CELL), cx1 = Math.floor((p.x + REACH) / GRID_CELL);
    const cz0 = Math.floor((p.z - REACH) / GRID_CELL), cz1 = Math.floor((p.z + REACH) / GRID_CELL);
    for (let cx = cx0; cx <= cx1; cx++) {
      for (let cz = cz0; cz <= cz1; cz++) {
        const bucket = shellGrid.get(cellKey(cx, cz));
        if (!bucket) continue;
        for (const idx of bucket) {
          if (idx >= walls.length || mark[idx] === stamp) continue;
          mark[idx] = stamp;
          cand.push(idx);
        }
      }
    }
    cand.sort((a, b) => a - b);
    for (const idx of cand) {
      const w = walls[idx];
      if (p.x < w.minX - REACH || p.x > w.maxX + REACH ||
          p.z < w.minZ - REACH || p.z > w.maxZ + REACH) continue;
      const inside = pointInShell(w, p.x, p.z);
      const c = closestOnRing(w.pts, p.x, p.z);
      const d = inside ? 0 : c.d;
      if (d < best) { best = d; hit = w; }
      if (inside) break;
    }
    if (!hit) continue;
    const edge = edgeNearest(hit.pts, p.x, p.z);
    const s = placeSign(edge, p.label, 'name', hit.top, doorLift(hit, edge));
    if (s) names.push(s);
  }

  return names.concat(numbers).slice(0, SIGN_MAX);
}

// Every label is drawn into one atlas canvas, so all the signs in a city are
// a single textured mesh. Each plane is only as wide as the text it uses.
function buildSigns(signs) {
  if (!signs.length) return;

  const rows = Math.ceil(signs.length / SIGN_COLS);
  const cv = document.createElement('canvas');
  cv.width = SIGN_COLS * SIGN_CELL_W;
  cv.height = rows * SIGN_CELL_H;
  const ctx = cv.getContext('2d');
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  const buf = { pos: [], uv: [] };
  const PAD = 10;

  for (let i = 0; i < signs.length; i++) {
    const s = signs[i];
    const ox = (i % SIGN_COLS) * SIGN_CELL_W;
    const oy = ((i / SIGN_COLS) | 0) * SIGN_CELL_H;

    let text = s.text;
    let size = s.kind === 'number' ? 30 : 26;
    ctx.font = `${size}px "Iowan Old Style", Palatino, Georgia, serif`;
    const maxW = SIGN_CELL_W - PAD * 2;
    let w = ctx.measureText(text).width;
    if (w > maxW) {
      size = Math.max(13, Math.floor(size * maxW / w));
      ctx.font = `${size}px "Iowan Old Style", Palatino, Georgia, serif`;
      w = ctx.measureText(text).width;
      while (w > maxW && text.length > 2) {          // still too long: clip it
        text = text.slice(0, -2) + '\u2026';
        w = ctx.measureText(text).width;
      }
    }

    const used = Math.min(SIGN_CELL_W, Math.ceil(w + PAD * 2));
    ctx.fillStyle = s.kind === 'number' ? '#e8e4dc' : '#1b1f27';
    ctx.fillRect(ox, oy, used, SIGN_CELL_H);
    ctx.fillStyle = s.kind === 'number' ? '#20242c' : '#e8e4dc';
    ctx.fillText(text, ox + PAD, oy + SIGN_CELL_H / 2);

    const u0 = ox / cv.width, u1 = (ox + used) / cv.width;
    const v1 = 1 - oy / cv.height, v0 = 1 - (oy + SIGN_CELL_H) / cv.height;

    // right = up x normal, so the quad faces along (nx, 0, nz)
    const rx = s.nz, rz = -s.nx;
    const hw = s.h * (used / SIGN_CELL_H) / 2, hh = s.h / 2;
    const bl = [s.x - rx * hw, s.y - hh, s.z - rz * hw];
    const br = [s.x + rx * hw, s.y - hh, s.z + rz * hw];
    const tr = [s.x + rx * hw, s.y + hh, s.z + rz * hw];
    const tl = [s.x - rx * hw, s.y + hh, s.z - rz * hw];

    buf.pos.push(...bl, ...br, ...tr, ...bl, ...tr, ...tl);
    buf.uv.push(u0, v0, u1, v0, u1, v1, u0, v0, u1, v1, u0, v1);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(buf.uv, 2));
  g.computeVertexNormals();
  g.computeBoundingSphere();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex }));
  scene.add(mesh);
  layers.push(mesh);
  invalidate();
}

// ---------------------------------------------------------------- collision
//
// Two broadphase grids over the same cells:
//   grid / gridWalls   solids: building wall pieces, lintels, barrier boxes.
//                      Small rings, pushed against sideways, stood on from above.
//   shellGrid / shells whole footprints: roof you can land on, raised floors,
//                      ceilings you bump your head on, sign placement. Never
//                      pushed against, so the inside of a building is open space.

let grid = new Map();
let gridWalls = [];
let shellGrid = new Map();
let shells = [];
let solidStamp = new Uint32Array(0);
let stampNo = 0;

function cellKey(cx, cz) { return cx + ',' + cz; }

function buildGrid(solids) {
  gridWalls = solids;
  grid = gridOf(solids, GRID_CELL);
  solidStamp = new Uint32Array(solids.length);
  stampNo = 0;
}

function pointInRing(pts, x, z) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

const near = { x: 0, z: 0, d: 0 };
function closestOnRing(pts, x, z) {
  let best = Infinity, bx = x, bz = z;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    const dx = xi - xj, dz = zi - zj;
    const len2 = dx * dx + dz * dz;
    let t = len2 > 0 ? ((x - xj) * dx + (z - zj) * dz) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = xj + dx * t, pz = zj + dz * t;
    const d = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d < best) { best = d; bx = px; bz = pz; }
  }
  near.x = bx; near.z = bz; near.d = Math.sqrt(best);
  return near;
}

// Push the player circle out of any solid it overlaps. Solids are wall pieces
// a few tenths of a meter thick, so the caller moves in SUBSTEP increments and
// the circle can never jump clean over one. A few passes so inside corners
// settle instead of ping-ponging between two pieces.
function resolveCollisions(pos) {
  const feetY = pos.y - EYE_HEIGHT, headY = pos.y + HEAD_CLEAR;
  const r = PLAYER_RADIUS;

  for (let pass = 0; pass < 4; pass++) {
    let moved = false;
    const cx = Math.floor(pos.x / GRID_CELL), cz = Math.floor(pos.z / GRID_CELL);
    if (++stampNo >= 0xffffffff) { solidStamp.fill(0); stampNo = 1; }

    for (let ox = -1; ox <= 1; ox++) {
      for (let oz = -1; oz <= 1; oz++) {
        const bucket = grid.get(cellKey(cx + ox, cz + oz));
        if (!bucket) continue;

        for (const idx of bucket) {
          if (solidStamp[idx] === stampNo) continue;
          solidStamp[idx] = stampNo;
          const w = gridWalls[idx];
          // gate by the slab the piece occupies: feet above its top or head
          // below its base (walking under a lintel) means nothing to hit
          if (feetY >= w.top - LAND_EPS || headY <= w.base) continue;
          if (pos.x < w.minX - r || pos.x > w.maxX + r || pos.z < w.minZ - r || pos.z > w.maxZ + r) continue;

          const inside = pointInRing(w.pts, pos.x, pos.z);
          const c = closestOnRing(w.pts, pos.x, pos.z);

          if (inside) {
            // walk out to the nearest face, then clear it by the player radius
            let dx = c.x - pos.x, dz = c.z - pos.z;
            const len = Math.hypot(dx, dz) || 1;
            pos.x = c.x + (dx / len) * r;
            pos.z = c.z + (dz / len) * r;
            moved = true;
          } else if (c.d < r) {
            let dx = pos.x - c.x, dz = pos.z - c.z;
            const len = Math.hypot(dx, dz) || 1;
            pos.x = c.x + (dx / len) * r;
            pos.z = c.z + (dz / len) * r;
            moved = true;
          }
        }
      }
    }
    if (!moved) break;
  }
}

// Horizontal move with collision, cut into steps no longer than SUBSTEP.
function moveAndCollide(pos, dx, dz) {
  const n = Math.max(1, Math.ceil(Math.hypot(dx, dz) / SUBSTEP));
  for (let k = 0; k < n; k++) {
    pos.x += dx / n;
    pos.z += dz / n;
    resolveCollisions(pos);
  }
}

// The surface the feet pass down through between `fromFeet` and `toFeet`, or 0
// for the street. Only surfaces the feet were already above are eligible, so
// walking about inside a building never snaps you up onto its roof.
function supportAt(x, z, fromFeet, toFeet) {
  let best = 0;
  const cx = Math.floor(x / GRID_CELL), cz = Math.floor(z / GRID_CELL);
  const ok = y => y > best && y <= fromFeet + LAND_EPS && y >= toFeet;

  for (let ox = -1; ox <= 1; ox++) {
    for (let oz = -1; oz <= 1; oz++) {
      const key = cellKey(cx + ox, cz + oz);

      const bucket = grid.get(key);           // wall and barrier tops
      if (bucket) {
        for (const idx of bucket) {
          const w = gridWalls[idx];
          if (!ok(w.top)) continue;
          if (x < w.minX || x > w.maxX || z < w.minZ || z > w.maxZ) continue;
          if (pointInRing(w.pts, x, z)) best = w.top;
        }
      }

      const sb = shellGrid.get(key);          // roofs, and floors of raised buildings
      if (sb) {
        for (const idx of sb) {
          const w = shells[idx];
          const roof = ok(w.top), floor = w.floor > 0 && ok(w.floor);
          if (!roof && !floor) continue;
          if (x < w.minX || x > w.maxX || z < w.minZ || z > w.maxZ) continue;
          if (!pointInShell(w, x, z)) continue;
          if (roof) best = w.top;
          else best = w.floor;
        }
      }
    }
  }
  return best;
}

// The lowest overhead surface the head passes up through between `fromHead`
// and `toHead`, or Infinity: interior ceilings, the underside of a raised
// building, and the lintel over a doorway.
function ceilingAt(x, z, fromHead, toHead) {
  let best = Infinity;
  const cx = Math.floor(x / GRID_CELL), cz = Math.floor(z / GRID_CELL);
  const ok = y => y < best && y >= fromHead - LAND_EPS && y < toHead;

  for (let ox = -1; ox <= 1; ox++) {
    for (let oz = -1; oz <= 1; oz++) {
      const key = cellKey(cx + ox, cz + oz);

      const bucket = grid.get(key);
      if (bucket) {
        for (const idx of bucket) {
          const w = gridWalls[idx];
          if (w.base <= 0.05 || !ok(w.base)) continue;
          if (x < w.minX || x > w.maxX || z < w.minZ || z > w.maxZ) continue;
          if (pointInRing(w.pts, x, z)) best = w.base;
        }
      }

      const sb = shellGrid.get(key);
      if (sb) {
        for (const idx of sb) {
          const w = shells[idx];
          const ceil = ok(w.ceil), under = w.base > 0.05 && ok(w.base);
          if (!ceil && !under) continue;
          if (x < w.minX || x > w.maxX || z < w.minZ || z > w.maxZ) continue;
          if (!pointInShell(w, x, z)) continue;
          if (under) best = w.base;         // the lower of the two when both apply
          else best = w.ceil;
        }
      }
    }
  }
  return best;
}

// ---------------------------------------------------------------- controls

const player = {
  pos: new THREE.Vector3(0, EYE_HEIGHT, 0),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  grounded: true
};
const keys = new Set();
let active = false;

addEventListener('keydown', e => {
  keys.add(e.code);
  wake();
  if (e.code === 'Space' && active) e.preventDefault();
});
addEventListener('keyup', e => { keys.delete(e.code); wake(); });

renderer.domElement.addEventListener('click', () => {
  if (IS_TOUCH) return;
  if (!panel.classList.contains('hidden')) return;
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  active = document.pointerLockElement === renderer.domElement;
  dotEl.classList.toggle('on', active);
  if (!active) keys.clear();
  wake();
});

addEventListener('mousemove', e => {
  if (!active) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  const lim = Math.PI / 2 - 0.01;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
  wake();
});

addEventListener('keydown', e => {
  if (e.code === 'Escape' && !active) { panel.classList.remove('hidden'); showControls(false); }
});

// ---------------------------------------------------------------- touch

// Left half of the screen is a floating stick; right half is look-drag, and a
// double tap there jumps. There is no pointer lock on mobile, so `active` is
// set by hand when the panel closes.
const IS_TOUCH = true;
const STICK_RADIUS = 55;          // px of travel for full tilt
const TAP_GAP_MS   = 300;

const touchMove = { x: 0, z: 0 };
let stickId = null, stickCx = 0, stickCy = 0;
let lookId = null, lookX = 0, lookY = 0;
let lastTapAt = 0, jumpQueued = false;
// knob offset is written to the DOM once per frame, not once per pointermove
let knobDx = 0, knobDy = 0, knobDirty = false;

if (IS_TOUCH) {
  const el = renderer.domElement;

  el.addEventListener('pointerdown', e => {
    if (!active || e.pointerType !== 'touch') return;

    if (e.clientX < innerWidth / 2 && stickId === null) {
      stickId = e.pointerId;
      stickCx = e.clientX; stickCy = e.clientY;
      stickEl.style.left = stickCx + 'px';
      stickEl.style.top  = stickCy + 'px';
      knobEl.style.transform = 'translate(0px, 0px)';
      stickEl.classList.add('on');
    } else if (lookId === null) {
      lookId = e.pointerId;
      lookX = e.clientX; lookY = e.clientY;
      const now = performance.now();
      if (now - lastTapAt < TAP_GAP_MS) { jumpQueued = true; lastTapAt = 0; }
      else lastTapAt = now;
    }
